[workspace]
resolver = "2"
members = [
    "crates/forge",
    "crates/forge-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Kura Linux Team <admin@kuralinux.org>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/kuralinux/forge"

[workspace.metadata.sonar]
project-key = "inimuqsith_Forge"
organization = "inimuqsith"
exclusions = ["target/**", "scripts/**"]

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.5", features = ["derive", "env", "cargo"] }
colored = "3.0"
indicatif = "0.17"
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
zstd = "0.13"
tar = "0.4"
sha2 = "0.10"
blake3 = "1.6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream"] }
dialoguer = "0.11"
regex = "1.11"
tempfile = "3.17"
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "trace"] }
fs2 = "0.4"
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "rand_core", "serde"] }
rand = "0.8"
version-compare = "0.2"
rayon = "1.10"
nix = { version = "0.29", default-features = false, features = ["signal", "resource", "fs", "process"] }
async-compression = { version = "0.4", features = ["tokio", "zstd"] }
tokio-util = { version = "0.7", features = ["io"] }
hex = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
