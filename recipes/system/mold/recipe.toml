[package]
name = "mold"
version = "2.42.1"
release = 1
slot = "0"
description = "High-performance modern linker (Latest 2.42.1)"
license = "MIT"
upstream = "https://github.com/rui314/mold"

[dependencies]
runtime = ["glibc", "zlib", "openssl"]
build = ["gcc", "cmake", "make"]

[sources]
urls = [
    "https://github.com/rui314/mold/archive/refs/tags/v2.42.1.tar.gz"
]
sha256 = ["0580221bfdad7148ceeafd0ad3c1c7b3ca9e66b45950405230cc3f81a205c816"]

[build]
type = "cmake"
script = """
cd "${srcdir}/mold-${pkgver}"
cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DMOLD_USE_SYSTEM_MIMALLOC=OFF -DMOLD_USE_SYSTEM_TBB=OFF
cmake --build build ${MAKEFLAGS}
DESTDIR="${DESTDIR}" cmake --install build
"""
