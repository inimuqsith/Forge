[package]
name = "mold"
version = "3.0.0"
release = 1
slot = "0"
description = "High-performance modern linker (Latest 2.42.1)"
license = "MIT"
upstream = "https://github.com/rui314/mold"

[dependencies]
runtime = ["glibc", "zlib", "openssl"]
build = ["gcc", "cmake", "make"]

[sources]
urls = [
    "https://github.com/rui314/mold/archive/refs/tags/v2.42.1.tar.gz"
]
sha256 = [
    "1dee837e227b0c3f2661def602ef8ddc0b889ae5b1d28c1ddec5f29e08e5ceb5"
]

[build]
type = "cmake"
script = """
cd "${srcdir}/mold-${pkgver}"
cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DMOLD_USE_SYSTEM_MIMALLOC=OFF -DMOLD_USE_SYSTEM_TBB=OFF -DCMAKE_DISABLE_FIND_PACKAGE_BLAKE3=ON
cmake --build build ${MAKEFLAGS}
DESTDIR="${DESTDIR}" cmake --install build
"""
