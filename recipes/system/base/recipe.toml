[package]
name = "base"
version = "1.0.0"
release = 1
slot = "0"
description = "Kura Linux Minimal Base System (Meta-Package)"
license = "GPL-3.0-or-later"
upstream = "https://kuralinux.org"

[dependencies]
runtime = ["glibc", "coreutils", "sed", "grep", "gawk", "tar", "gzip", "bzip2", "xz", "zstd", "findutils", "diffutils", "file", "which", "util-linux", "shadow", "openrc", "eudev", "kmod", "ca-certificates"]
build = []

[sources]
urls = [

]
sha256 = []

[build]
type = "meta"
script = """
echo "Building Kura Linux Base System meta-package..."
mkdir -p "${DESTDIR}/etc/forge"
echo "Kura Linux Minimal Base System v${pkgver}" > "${DESTDIR}/etc/kura-release"
"""
