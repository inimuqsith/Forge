[package]
name = "linux-headers"
version = "7.2"
release = 1
slot = "0"
description = "Linux kernel API headers for userspace"
license = "GPL-2.0-only"
upstream = "https://www.kernel.org/"

[dependencies]
runtime = []
build = []

[sources]
urls = [
    "https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-7.2.tar.xz"
]
sha256 = [
    "f9fef3d14c0df53819026f4be74459835c2a0b0dcbf5b5bbd9ea19f0829402b3"
]

[build]
type = "custom"
script = """
cd "${srcdir}/linux-${pkgver}"
make mrproper
make headers
find usr/include -type f ! -name '*.h' -delete
mkdir -p "${DESTDIR}/usr"
cp -rv usr/include "${DESTDIR}/usr/"
"""
