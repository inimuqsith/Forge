[package]
name = "autoconf"
version = "2.73"
release = 1
slot = "0"
description = "Extensible package of M4 macros to produce configuration scripts"
license = "GPL-3.0-or-later"
upstream = "https://www.gnu.org/software/autoconf/"

[dependencies]
runtime = ["m4", "glibc"]
build = ["make", "m4", "gcc"]

[sources]
urls = [
    "https://ftp.gnu.org/gnu/autoconf/autoconf-2.73.tar.xz"
]
sha256 = ["9fd672b1c8425fac2fa67fa0477b990987268b90ff36d5f016dae57be0d6b52e"]

[build]
type = "autotools"
script = """
cd "${srcdir}/autoconf-${pkgver}"
./configure --prefix=/usr
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
