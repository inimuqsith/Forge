[package]
name = "flex"
version = "2.6.5"
release = 1
slot = "0"
description = "Fast lexical analyzer generator"
license = "BSD-2-Clause"
upstream = "https://github.com/westes/flex"

[dependencies]
runtime = ["glibc", "m4"]
build = ["make", "m4", "bison", "gcc"]

[sources]
urls = [
    "https://github.com/westes/flex/releases/download/v2.6.4/flex-2.6.4.tar.gz"
]
sha256 = [
    "4dfb3d6095c0cd58f050dd66fa132ad52c118c5ae26a4bddd916557720920769"
]

[build]
type = "autotools"
script = """
cd "${srcdir}/flex-${pkgver}"
./configure --prefix=/usr --disable-static
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
