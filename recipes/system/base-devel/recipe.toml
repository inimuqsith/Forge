[package]
name = "base-devel"
version = "1.0.0"
release = 1
slot = "0"
description = "Kura Linux Base Development Toolchain (Meta-Package)"
license = "GPL-3.0-or-later"
upstream = "https://kuralinux.org"

[dependencies]
runtime = [
    "glibc",
    "llvm",
    "mold",
    "make",
    "ninja",
    "gcc",
    "binutils",
    "pkgconf",
    "linux-headers",
    "patch",
]

[build]
type = "meta"
script = """
echo "Building Kura Linux Base-Devel Toolchain meta-package..."
mkdir -p "${DESTDIR}/etc/forge"
echo "Kura Linux Base Development Toolchain v${pkgver}" > "${DESTDIR}/etc/kura-devel-release"
"""
