[package]
name = "ninja"
version = "1.13.2"
release = 1
slot = "0"
description = "Small build system with a focus on speed (Latest 1.13.2)"
license = "Apache-2.0"
upstream = "https://ninja-build.org/"

[dependencies]
runtime = ["glibc", "libstdc++"]
build = ["gcc", "python"]

[sources]
urls = [
    "https://github.com/ninja-build/ninja/archive/refs/tags/v1.13.2.tar.gz"
]
sha256 = ["974d6b2f4eeefa25625d34da3cb36bdcebe7fbce40f4c16ac0835fd1c0cbae17"]

[build]
type = "custom"
script = """
cd "${srcdir}/ninja-${pkgver}"
python3 configure.py --bootstrap
install -Dm755 ninja "${DESTDIR}/usr/bin/ninja"
"""
