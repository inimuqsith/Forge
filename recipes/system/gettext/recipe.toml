[package]
name = "gettext"
version = "0.24"
release = 1
slot = "0"
description = "GNU internationalization and localization utilities"
license = "GPL-3.0-or-later"
upstream = "https://www.gnu.org/software/gettext/"

[dependencies]
runtime = ["glibc", "acl", "ncurses"]
build = ["make", "gcc"]

[sources]
urls = [
    "https://ftp.gnu.org/gnu/gettext/gettext-0.24.tar.xz"
]
sha256 = [
    "e1620d518b26d7d3b16ac570e5018206e8b0d725fb65c02d048397718b5cf318"
]

[build]
type = "autotools"
script = """
cd "${srcdir}/gettext-${pkgver}"
./configure --prefix=/usr --disable-static --docdir=/usr/share/doc/gettext-0.24
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
