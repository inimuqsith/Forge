[package]
name = "gettext"
version = "1.0"
release = 1
slot = "0"
description = "GNU internationalization and localization utilities"
license = "GPL-3.0-or-later"
upstream = "https://www.gnu.org/software/gettext/"

[dependencies]
runtime = ["glibc", "acl", "ncurses"]
build = ["make", "gcc"]

[sources]
urls = [
    "https://ftp.gnu.org/gnu/gettext/gettext-1.0.tar.xz"
]
sha256 = [
    "71132a3fb71e68245b8f2ac4e9e97137d3e5c02f415636eb508ae607bc01add7"
]

[build]
type = "autotools"
script = """
cd "${srcdir}/gettext-${pkgver}"
./configure --prefix=/usr --disable-static --docdir=/usr/share/doc/gettext-0.24
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
