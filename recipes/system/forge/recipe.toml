[package]
name = "forge"
version = "git"
release = 1
slot = "0"
description = "High-Performance Source-First & Hybrid Package Manager for Kura Linux"
license = "GPL-3.0-or-later"
upstream = "https://github.com/inimuqsith/Forge"

[dependencies]
runtime = [
    "glibc", "zlib", "zstd", "bubblewrap", "mold", "clang", "llvm",
    "git", "ca-certificates", "tar", "xz"
]
build = [
    "rust", "mold", "clang", "llvm", "pkgconf", "git"
]

[sources]
urls = [
    "https://github.com/inimuqsith/Forge.git#branch=main"
]
sha256 = [
    "SKIP"
]

[build]
type = "custom"
script = """
cd "${srcdir}/Forge" || cd "${srcdir}"

# Isolasi hermetis CARGO_HOME agar tidak bergantung atau mencemari direktori host (~/.cargo)
export CARGO_HOME="${srcdir}/.cargo_home"
mkdir -p "${CARGO_HOME}"

# Bersihkan flag LTO dari CFLAGS/CXXFLAGS/LDFLAGS agar cc-rs crate (ring, zstd-sys) mengompilasi native C machine code
export CFLAGS="$(echo "${CFLAGS}" | sed -E 's/-flto(=[^ ]*)?//g') -fno-lto"
export CXXFLAGS="$(echo "${CXXFLAGS}" | sed -E 's/-flto(=[^ ]*)?//g') -fno-lto"
export LDFLAGS="$(echo "${LDFLAGS}" | sed -E 's/-flto(=[^ ]*)?//g')"

# Kompilasi rilis forge CLI dengan Mold linker
cargo build --release -p forge

# Pasang biner forge ke /usr/bin
install -d -m 0755 "${pkgdir}/usr/bin"
install -m 0755 target/release/forge "${pkgdir}/usr/bin/forge"

# Pasang konfigurasi paten default ke /usr/share/forge/forge.conf.default (Selalu ter-update)
install -d -m 0755 "${pkgdir}/usr/share/forge"
install -m 0644 config/forge.conf.default "${pkgdir}/usr/share/forge/forge.conf.default"

# Pasang konfigurasi kustom awal ke /etc/forge/forge.conf jika belum ada
install -d -m 0755 "${pkgdir}/etc/forge"
if [ ! -f "${pkgdir}/etc/forge/forge.conf" ]; then
    install -m 0644 config/forge.conf.default "${pkgdir}/etc/forge/forge.conf"
fi

# Pasang direktori state sistem
install -d -m 0755 "${pkgdir}/var/db/forge/installed"
install -d -m 0755 "${pkgdir}/var/db/forge/recipes"
install -d -m 0755 "${pkgdir}/var/cache/forge"
install -d -m 0755 "${pkgdir}/tmp/forge/stage"
"""
