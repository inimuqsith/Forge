[package]
name = "meson"
version = "1.12.0"
release = 1
slot = "0"
description = "Fast and user friendly build system"
license = "Apache-2.0"
upstream = "https://mesonbuild.com/"

[dependencies]
runtime = [
    "python",
    "ninja",
]
build = [
    "python",
]

[sources]
urls = [
    "https://github.com/mesonbuild/meson/releases/download/1.12.0/meson-1.12.0.tar.gz",
]
sha256 = ["88afe0c20e52030218924ac37d0c81c59b4b5f3ae3752c8c6d7470c7d365886c"]

[build]
type = "custom"
script = """
cd "${srcdir}/meson-${pkgver}"
python -m pip install --no-deps --root="${DESTDIR}" --prefix=/usr .
"""
