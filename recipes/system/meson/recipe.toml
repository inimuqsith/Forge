[package]
name = "meson"
version = "1.7.0"
release = 1
slot = "0"
description = "Fast and user friendly build system"
license = "Apache-2.0"
upstream = "https://mesonbuild.com/"

[dependencies]
runtime = [
    "python",
    "ninja",
]
build = [
    "python",
]

[sources]
urls = [
    "https://github.com/mesonbuild/meson/releases/download/1.7.0/meson-1.7.0.tar.gz",
]
sha256 = []

[build]
type = "custom"
script = """
cd "${srcdir}/meson-${pkgver}"
python -m pip install --no-deps --root="${DESTDIR}" --prefix=/usr .
"""
