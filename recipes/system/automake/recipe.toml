[package]
name = "automake"
version = "1.19"
release = 1
slot = "0"
description = "Tool for automatically generating Makefile.in files"
license = "GPL-2.0-or-later"
upstream = "https://www.gnu.org/software/automake/"

[dependencies]
runtime = ["autoconf", "glibc"]
build = ["make", "autoconf", "gcc"]

[sources]
urls = [
    "https://ftp.gnu.org/gnu/automake/automake-1.19.tar.xz"
]
sha256 = ["e3e2c2e3abf37898138db5b6c1d1dc35c9160c5978be7947d2c741705251d445"]

[build]
type = "autotools"
script = """
cd "${srcdir}/automake-${pkgver}"
./configure --prefix=/usr
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
