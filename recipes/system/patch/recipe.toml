[package]
name = "patch"
version = "2.8"
release = 1
slot = "0"
description = "Utility to apply diffs to files"
license = "GPL-3.0-or-later"
upstream = "https://savannah.gnu.org/projects/patch/"

[dependencies]
runtime = ["glibc"]
build = ["make", "gcc"]

[sources]
urls = [
    "https://ftp.gnu.org/gnu/patch/patch-2.8.tar.xz"
]
sha256 = [
    "f87cee69eec2b4fcbf60a396b030ad6aa3415f192aa5f7ee84cad5e11f7f5ae3"
]

[build]
type = "autotools"
script = """
cd "${srcdir}/patch-${pkgver}"
./configure --prefix=/usr
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
