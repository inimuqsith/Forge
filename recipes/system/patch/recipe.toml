[package]
name = "patch"
version = "2.8.1"
release = 1
slot = "0"
description = "Utility to apply diffs to files"
license = "GPL-3.0-or-later"
upstream = "https://savannah.gnu.org/projects/patch/"

[dependencies]
runtime = ["glibc"]
build = ["make", "gcc"]

[sources]
urls = [
    "https://ftp.gnu.org/gnu/patch/patch-2.8.tar.xz"
]
sha256 = [
    "3240c7959c5347c8ed347e3c4201c0337bf4240d5cf09d68889e58eeaba30e17"
]

[build]
type = "autotools"
script = """
cd "${srcdir}/patch-${pkgver}"
./configure --prefix=/usr
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
