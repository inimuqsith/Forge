[package]
name = "bubblewrap"
version = "0.13.0"
release = 1
slot = "0"
description = "Unprivileged sandboxing tool based on Linux user namespaces"
license = "LGPL-2.0-or-later"
upstream = "https://github.com/containers/bubblewrap"

[dependencies]
runtime = ["glibc", "libcap"]
build = ["meson", "ninja", "pkgconf", "gcc"]

[sources]
urls = [
    "https://github.com/containers/bubblewrap/releases/download/v0.12.0/bubblewrap-0.12.0.tar.xz"
]
sha256 = [
    "4734237473c0e5d695e4e9034a34e43b2dbf5164655bd13fa59ae376b2b7a765"
]

[build]
type = "meson"
script = """
cd "${srcdir}/bubblewrap-${pkgver}"
meson setup build --prefix=/usr --buildtype=release -Dman=disabled
ninja -C build ${MAKEFLAGS}
DESTDIR="${DESTDIR}" ninja -C build install
"""
