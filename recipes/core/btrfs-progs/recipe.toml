[package]
name = "btrfs-progs"
version = "7.3"
release = 1
slot = "0"
description = "Btrfs filesystem utilities"
license = "GPL-2.0-or-later"
upstream = "https://btrfs.readthedocs.io"

[dependencies]
runtime = ["glibc", "libgcrypt", "lzo", "eudev", "util-linux", "zlib", "zstd"]
build = ["gcc", "e2fsprogs", "pkgconf", "make"]

[sources]
urls = [
    "https://www.kernel.org/pub/linux/kernel/people/kdave/btrfs-progs/btrfs-progs-v7.1.tar.xz"
]
sha256 = [
    "d37b63403d25fe025704c758e6a3da0979ae50c30c5f02aa78e4410e7b346e3a"
]

[build]
type = "autotools"
script = """
cd "${srcdir}/btrfs-progs-${pkgver}"
./configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var --disable-static
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
