[package]
name = "kmod"
version = "34.3"
release = 1
description = "Linux kernel module management tools and library (lsmod, modprobe, insmod)"
license = "GPL-2.0-or-later AND LGPL-2.1-or-later"
upstream = "https://git.kernel.org/pub/scm/utils/kernel/kmod/kmod.git"
slot = "0"

[dependencies]
runtime = ["glibc", "zlib", "xz", "zstd", "openssl"]
build = ["gcc", "make", "pkgconf"]

[sources]
urls = ["https://kernel.org/pub/linux/utils/kernel/kmod/kmod-34.2.tar.xz"]
sha256 = [
    "985554de49c21a58abd68c6cda2251384e1e5bb08b3b14c7f02b51f4c90c2958"
]

[build]
compiler_override = "gcc"
disable_custom_march = true
cflags = "-O2 -pipe"
configure = """
./configure \
    --prefix=/usr \
    --sysconfdir=/etc \
    --with-zlib \
    --with-xz \
    --with-zstd \
    --with-openssl \
    --disable-manpages
"""
compile = """
make -j$(nproc)
"""
install = """
make DESTDIR="${DESTDIR}" install
for tool in lsmod modinfo rmmod insmod modprobe depmod; do
    ln -sf kmod "${DESTDIR}/usr/bin/${tool}"
done
"""
