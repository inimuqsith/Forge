[package]
name = "kmod"
version = "33"
release = 1
slot = "0"
description = "Linux kernel module management tools and library (lsmod, modprobe, insmod)"
license = "GPL-2.0-or-later AND LGPL-2.1-or-later"
upstream = "https://git.kernel.org/pub/scm/utils/kernel/kmod/kmod.git"

[dependencies]
runtime = [
    "glibc",
    "zlib",
    "xz",
    "zstd",
    "openssl",
]
build = [
    "make",
    "gcc",
    "pkgconf",
]

[sources]
urls = [
    "https://kernel.org/pub/linux/utils/kernel/kmod/kmod-33.tar.xz",
]
sha256 = []

[build]
type = "autotools"
script = """
cd "${srcdir}/kmod-${pkgver}"
./configure --prefix=/usr --sysconfdir=/etc --with-zlib --with-xz --with-zstd --with-openssl
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
for tool in lsmod modinfo rmmod insmod modprobe depmod; do
    ln -sf kmod "${DESTDIR}/usr/bin/${tool}"
done
"""
