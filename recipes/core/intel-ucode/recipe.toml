[package]
name = "intel-ucode"
version = "microcode-20260925 Release"
release = 1
slot = "0"
description = "Microcode update files and early-initramfs image for Intel CPUs"
license = "Custom"
upstream = "https://github.com/intel/Intel-Linux-Processor-Microcode-Data-Files"

[dependencies]
runtime = []
build = []

[sources]
urls = [
    "https://github.com/intel/Intel-Linux-Processor-Microcode-Data-Files/archive/refs/tags/microcode-20260812.tar.gz"
]
sha256 = [
    "7614616d7b2988c278060486f47de716ef44c19317928cb45ac9e288fafd5bd1"
]

[build]
type = "custom"
script = """
cd "${srcdir}/Intel-Linux-Processor-Microcode-Data-Files-microcode-${pkgver}"
mkdir -p "${DESTDIR}/usr/lib/firmware/intel-ucode"
mkdir -p "${DESTDIR}/boot"
cp -r intel-ucode/* "${DESTDIR}/usr/lib/firmware/intel-ucode/"

# Kemas early initramfs cpio image
mkdir -p early_ucode/kernel/x86/microcode
cp intel-ucode/* early_ucode/kernel/x86/microcode/ 2>/dev/null || true
cd early_ucode
find . | cpio -o -H newc -R 0:0 > "${DESTDIR}/boot/intel-ucode.img" 2>/dev/null || true
"""
