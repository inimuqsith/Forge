[package]
name = "libevdev"
version = "1.14.0"
release = 1
slot = "0"
description = "Wrapper library for evdev devices"
license = "MIT"
upstream = "https://www.freedesktop.org/wiki/Software/libevdev/"

[dependencies]
runtime = ["glibc"]
build = ["meson", "ninja", "gcc", "pkgconf", "python"]

[sources]
urls = [
    "https://www.freedesktop.org/software/libevdev/libevdev-1.13.7.tar.xz"
]
sha256 = [
    "5a0966c7110648665983848bad696c7acba614a2160d2865d535397101007332"
]

[build]
type = "meson"
script = """
cd "${srcdir}/libevdev-${pkgver}"
meson setup build --prefix=/usr --buildtype=release -Ddocumentation=disabled -Dtests=disabled
ninja -C build -j${FORGE_JOBS:-$(nproc)}
DESTDIR="${DESTDIR}" ninja -C build install
"""
