[package]
name = "polkit"
version = "127"
release = 3
slot = "0"
description = "Application development toolkit for controlling system-wide privileges"
license = "LGPL-2.0-or-later"
upstream = "https://github.com/polkit-org/polkit"

[dependencies]
runtime = ["glibc", "duktape", "expat", "glib2", "pam", "eudev"]
build = ["gcc", "dbus", "glib2", "gobject-introspection", "meson", "ninja", "pkgconf"]

[sources]
urls = [
    "https://github.com/polkit-org/polkit/archive/refs/tags/127.tar.gz"
]
sha256 = ["9b7bc16f086479dcc626c575976568ba4a85d34297a750d8ab3d2e57f6d8b988"]

[build]
type = "meson"
script = """
cd "${srcdir}/polkit-${pkgver}"
meson setup build --prefix=/usr --buildtype=release
ninja -C build ${MAKEFLAGS}
DESTDIR="${DESTDIR}" ninja -C build install
"""
