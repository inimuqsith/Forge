[package]
name = "gawk"
version = "5.4.1"
release = 1
slot = "0"
description = "GNU awk pattern scanning and processing language"
license = "GPL-3.0-or-later"
upstream = "https://www.gnu.org/software/gawk/"

[dependencies]
runtime = ["glibc", "readline", "gmp", "mpfr"]
build = ["make", "gcc"]

[sources]
urls = [
    "https://ftp.gnu.org/gnu/gawk/gawk-5.4.1.tar.xz"
]
sha256 = ["07f6f7342b7febe4313fc2c2542ad93d64fe20ad8717200109f105a826f5fd37"]

[build]
type = "autotools"
script = """
cd "${srcdir}/gawk-${pkgver}"
./configure --prefix=/usr --sysconfdir=/etc
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
