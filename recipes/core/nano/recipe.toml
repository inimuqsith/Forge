[package]
name = "nano"
version = "9.2"
release = 1
slot = "0"
description = "Pico editor clone with enhancements"
license = "GPL-3.0-or-later"
upstream = "https://nano-editor.org/"

[dependencies]
runtime = ["glibc", "ncurses", "file"]
build = ["make", "gcc", "pkgconf"]

[sources]
urls = [
    "https://nano-editor.org/dist/v9/nano-9.2.tar.xz"
]
sha256 = [
    "05ecb99247b782e8a5b3a25ed4101dd034b0236902f7449bc9795b717642f7e9"
]

[build]
type = "autotools"
script = """
cd "${srcdir}/nano-${pkgver}"
./configure --prefix=/usr --sysconfdir=/etc --enable-utf8 --enable-color --enable-extra
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
