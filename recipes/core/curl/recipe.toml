[package]
name = "curl"
version = "8.23.0"
release = 1
slot = "0"
description = "Command line tool and library for transferring data with URLs"
license = "curl"
upstream = "https://curl.se/"

[dependencies]
runtime = ["glibc", "openssl", "zlib", "zstd", "nghttp2"]
build = ["make", "gcc", "pkgconf"]

[sources]
urls = [
    "https://curl.se/download/curl-8.22.0.tar.xz"
]
sha256 = [
    "8dadd7d2536a314f982ad05a651b713f426bf7d02cc2c76cffb9796f2218e6c5"
]

[build]
type = "autotools"
script = """
cd "${srcdir}/curl-${pkgver}"
./configure --prefix=/usr --with-ssl --with-zlib --with-zstd --with-nghttp2 --with-ca-bundle=/etc/ssl/certs/ca-certificates.crt
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
