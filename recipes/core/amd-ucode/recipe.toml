[package]
name = "amd-ucode"
version = "20260916"
release = 1
slot = "0"
description = "Microcode update image and firmware for AMD CPUs"
license = "Custom"
upstream = "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git"

[dependencies]
runtime = []
build = []

[sources]
urls = [
    "https://mirrors.edge.kernel.org/pub/linux/kernel/firmware/linux-firmware-20260916.tar.xz"
]
sha256 = [
    "f80dcb757a623deda62200c08e0e1a88c76fb6b54964f31b35fa74da1c90ccc5"
]

[build]
type = "custom"
script = """
cd "${srcdir}/linux-firmware-${pkgver}"
mkdir -p "${DESTDIR}/usr/lib/firmware/amd-ucode"
mkdir -p "${DESTDIR}/boot"
if [ -d "amd-ucode" ]; then
    cp -r amd-ucode/* "${DESTDIR}/usr/lib/firmware/amd-ucode/"
fi

mkdir -p early_ucode/kernel/x86/microcode
if [ -d "amd-ucode" ]; then
    cp amd-ucode/*.bin early_ucode/kernel/x86/microcode/ 2>/dev/null || true
fi
cd early_ucode
find . | cpio -o -H newc -R 0:0 > "${DESTDIR}/boot/amd-ucode.img" 2>/dev/null || true
"""
