[package]
name = "libcap-ng"
version = "0.8.5"
release = 1
slot = "0"
description = "Alternate POSIX capabilities library"
license = "LGPL-2.1-or-later AND GPL-2.0-or-later"
upstream = "https://people.redhat.com/sgrubb/libcap-ng/"

[dependencies]
runtime = ["glibc"]
build = ["make", "gcc"]

[sources]
urls = [
    "https://people.redhat.com/sgrubb/libcap-ng/libcap-ng-0.8.5.tar.gz"
]
sha256 = [
    "3ba5294d1cbdfa98afaacfbc00b6af9ed2b83e8a21817185dfd844cc8c7ac6ff"
]

[build]
type = "autotools"
script = """
cd "${srcdir}/libcap-ng-${pkgver}"
./configure --prefix=/usr --without-python --without-python3
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
