[package]
name = "util-linux"
version = "2.42.3"
release = 1
slot = "0"
description = "Miscellaneous system utilities for Linux"
license = "GPL-2.0-or-later"
upstream = "https://github.com/util-linux/util-linux"

[dependencies]
runtime = ["glibc", "ncurses", "zlib", "libcap", "libseccomp"]
build = ["make", "gcc", "pkgconf"]

[sources]
urls = [
    "https://github.com/util-linux/util-linux/archive/refs/tags/v2.42.3.tar.gz"
]
sha256 = [
    "23cff3e5df43b4bc9ce309e0ed4bc0071acb4f5016bc005fe0f8a1359372cede"
]

[build]
type = "autotools"
script = """
cd "${srcdir}/util-linux-${pkgver}"
./configure --prefix=/usr --disable-chfn-chsh --disable-login --disable-nologin --disable-su --disable-setpriv --disable-runuser --without-systemd
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
