[package]
name = "util-linux"
version = "2.42.4"
release = 1
slot = "0"
description = "Miscellaneous system utilities for Linux"
license = "GPL-2.0-or-later"
upstream = "https://github.com/util-linux/util-linux"

[dependencies]
runtime = ["glibc", "ncurses", "zlib", "libcap", "libseccomp"]
build = ["make", "gcc", "pkgconf"]

[sources]
urls = [
    "https://kernel.org/pub/linux/utils/util-linux/v2.42/util-linux-2.42.3.tar.xz"
]
sha256 = [
    "fbd62a100ab7bb8746ba0661255c3c48185b1e9021507c624da01fbc696330ec"
]

[build]
type = "autotools"
script = """
cd "${srcdir}/util-linux-${pkgver}"
./configure --prefix=/usr \
    --disable-chfn-chsh \
    --disable-login \
    --disable-nologin \
    --disable-su \
    --disable-setpriv \
    --disable-runuser \
    --without-systemd \
    --disable-use-tty-group \
    --disable-makeinstall-chown \
    --disable-makeinstall-setuid
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
