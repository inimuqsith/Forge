[package]
name = "libgpg-error"
version = "1.61"
release = 1
slot = "0"
description = "Small library with error codes and strings based on libgcrypt"
license = "LGPL-2.1-or-later AND GPL-2.0-or-later"
upstream = "https://gnupg.org/software/libgpg-error/"

[dependencies]
runtime = ["glibc"]
build = ["make", "gcc"]

[sources]
urls = [
    "https://gnupg.org/ftp/gcrypt/libgpg-error/libgpg-error-1.61.tar.bz2"
]
sha256 = [
    "7a85413f2bc354f4f8aa832b718af122e48965e9e0eb9012ee659c13c6385c93"
]

[build]
type = "autotools"
script = """
cd "${srcdir}/libgpg-error-${pkgver}"
./configure --prefix=/usr
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
