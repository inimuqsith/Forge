[package]
name = "libgpg-error"
version = "1.51"
release = 1
slot = "0"
description = "Small library with error codes and strings based on libgcrypt"
license = "LGPL-2.1-or-later AND GPL-2.0-or-later"
upstream = "https://gnupg.org/software/libgpg-error/"

[dependencies]
runtime = ["glibc"]
build = ["make", "gcc"]

[sources]
urls = [
    "https://gnupg.org/ftp/gcrypt/libgpg-error/libgpg-error-1.51.tar.bz2"
]
sha256 = [
    "be0f1b2db6b93eed55369cdf79f19f72750c8c7c39fc20b577e724545427e6b2"
]

[build]
type = "autotools"
script = """
cd "${srcdir}/libgpg-error-${pkgver}"
./configure --prefix=/usr
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
