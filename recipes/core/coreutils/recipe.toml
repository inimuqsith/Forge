[package]
name = "coreutils"
version = "9.12"
release = 1
slot = "0"
description = "The basic file, shell and text manipulation utilities of the GNU operating system"
license = "GPL-3.0-or-later"
upstream = "https://www.gnu.org/software/coreutils/"

[dependencies]
runtime = ["glibc", "libcap", "acl", "attr"]
build = ["make", "gcc", "pkgconf"]

[sources]
urls = [
    "https://ftp.gnu.org/gnu/coreutils/coreutils-9.12.tar.xz"
]
sha256 = [
    "a480198559733e9b3da999e90543ac6f888a2caa544d8d664c5a1f17e528e210"
]

[build]
type = "autotools"
script = """
cd "${srcdir}/coreutils-${pkgver}"
./configure --prefix=/usr --libexecdir=/usr/lib --enable-no-install-program=kill,uptime
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
