[package]
name = "nghttp2"
version = "1.71.0"
release = 1
slot = "0"
description = "HTTP/2 C library and tools"
license = "MIT"
upstream = "https://nghttp2.org/"

[dependencies]
runtime = ["glibc", "zlib"]
build = ["make", "gcc", "pkgconf"]

[sources]
urls = [
    "https://github.com/nghttp2/nghttp2/releases/download/v1.70.0/nghttp2-1.70.0.tar.xz"
]
sha256 = [
    "c0f55121d88650e4b9227aec28cebaf664d2417ca60fe70be0f8d38829f52116"
]

[build]
type = "autotools"
script = """
cd "${srcdir}/nghttp2-${pkgver}"
./configure --prefix=/usr --disable-static --enable-lib-only
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
