[package]
name = "man-pages"
version = "6.20"
release = 1
slot = "0"
description = "Linux system documentation manual pages"
license = "GPL-2.0-or-later"
upstream = "https://kernel.org/pub/linux/docs/man-pages/"

[dependencies]
runtime = ["glibc"]
build = ["make"]

[sources]
urls = [
    "https://kernel.org/pub/linux/docs/man-pages/man-pages-6.19.tar.xz"
]
sha256 = [
    "180f0d16a2142dd9671760ac0afeadcc25e861f695eb420293e1206a87ca083f"
]

[build]
type = "make"
script = """
cd "${srcdir}/man-pages-${pkgver}"
make prefix=/usr DESTDIR="${DESTDIR}" install
"""
