[package]
name = "xfsprogs"
version = "7.2.1"
release = 1
slot = "0"
description = "XFS filesystem utilities"
license = "GPL-2.0-or-later"
upstream = "https://xfs.wiki.kernel.org"

[dependencies]
runtime = ["glibc", "libedit", "libinih", "liburcu", "util-linux"]
build = ["gcc", "git", "icu"]

[sources]
urls = [
    "https://www.kernel.org/pub/linux/utils/fs/xfs/xfsprogs/xfsprogs-7.2.0.tar.xz"
]
sha256 = [
    "c45f5fd81fdebcdae61938fcfdff86c9960b39fc89a06df633730d93876cd27d"
]

[build]
type = "autotools"
script = """
cd "${srcdir}/xfsprogs-${pkgver}"
./configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var --disable-static
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
