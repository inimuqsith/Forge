[package]
name = "ncurses"
version = "6.5"
release = 1
slot = "0"
description = "System V Release 4.0 curses emulation library"
license = "MIT-open-group"
upstream = "https://invisible-island.net/ncurses/"

[dependencies]
runtime = ["glibc"]
build = ["make", "gcc", "pkgconf"]

[sources]
urls = [
    "https://ftp.gnu.org/gnu/ncurses/ncurses-6.5.tar.gz"
]
sha256 = ["136d91bc269a9a5785e5f9e980bc76ab57428f604ce3e5a5a90cebc767971cc6"]

[build]
type = "autotools"
script = """
cd "${srcdir}/ncurses-${pkgver}"
./configure --prefix=/usr --mandir=/usr/share/man --with-shared --with-cxx-shared --without-debug --without-ada --enable-widec --enable-pc-files --with-pkg-config-libdir=/usr/lib/pkgconfig
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
for lib in ncurses form panel menu; do
    echo "INPUT(-l${lib}w)" > "${DESTDIR}/usr/lib/lib${lib}.so"
    ln -sf ${lib}w.pc "${DESTDIR}/usr/lib/pkgconfig/${lib}.pc"
done
"""
