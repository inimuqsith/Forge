[package]
name = "pciutils"
version = "3.15.0"
release = 1
slot = "0"
description = "PCI bus configuration and diagnostic tools (lspci, setpci)"
license = "GPL-2.0-or-later"
upstream = "https://mj.ucw.cz/sw/pciutils/"

[dependencies]
runtime = ["glibc", "hwdata", "kmod"]
build = ["make", "gcc", "pkgconf"]

[sources]
urls = [
    "https://mj.ucw.cz/download/linux/pci/pciutils-3.15.0.tar.gz"
]
sha256 = ["a42e6e3f76fb6b1f6ac2e08cdd151f6bf78bc4f6312c591f4b6ec197582ede3a"]

[build]
type = "make"
script = """
cd "${srcdir}/pciutils-${pkgver}"
make PREFIX=/usr SHAREDIR=/usr/share/hwdata SHARED=yes ${MAKEFLAGS}
make PREFIX=/usr SHAREDIR=/usr/share/hwdata SHARED=yes DESTDIR="${DESTDIR}" install install-lib
"""
