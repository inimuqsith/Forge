[package]
name = "xkeyboard-config"
version = "2.48"
release = 1
slot = "0"
description = "X Keyboard Extension configuration data"
license = "MIT"
upstream = "https://www.freedesktop.org/wiki/Software/XKeyboardConfig"

[dependencies]
runtime = []
build = ["meson", "ninja", "gcc", "pkgconf", "python"]

[sources]
urls = [
    "https://www.x.org/releases/individual/data/xkeyboard-config/xkeyboard-config-2.48.tar.xz"
]
sha256 = [
    "b77041324f0109f77161ee43743fe04baa485866af8460d31e476ad3f7648fd5"
]

[build]
type = "meson"
script = """
cd "${srcdir}/xkeyboard-config-${pkgver}"
meson setup build --prefix=/usr --buildtype=release -Dnls=disabled
ninja -C build -j${FORGE_JOBS:-$(nproc)}
DESTDIR="${DESTDIR}" ninja -C build install
"""
