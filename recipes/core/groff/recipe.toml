[package]
name = "groff"
version = "1.24.1"
release = 1
slot = "0"
description = "GNU troff text-formatting system"
license = "GPL-3.0-or-later"
upstream = "https://www.gnu.org/software/groff/"

[dependencies]
runtime = ["glibc"]
build = ["make", "gcc", "bison", "pkgconf"]

[sources]
urls = [
    "https://ftp.gnu.org/gnu/groff/groff-1.24.1.tar.gz"
]
sha256 = ["74e2819795b6aff431aeac983d63a9c8968eeaba2a2eba7df8ba4c7b41e7cfd8"]

[build]
type = "autotools"
script = """
cd "${srcdir}/groff-${pkgver}"
./configure --prefix=/usr --without-x
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
