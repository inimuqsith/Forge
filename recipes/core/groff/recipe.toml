[package]
name = "groff"
version = "1.24.2"
release = 1
slot = "0"
description = "GNU troff text-formatting system"
license = "GPL-3.0-or-later"
upstream = "https://www.gnu.org/software/groff/"

[dependencies]
runtime = ["glibc"]
build = ["make", "gcc", "bison", "pkgconf"]

[sources]
urls = [
    "https://ftp.gnu.org/gnu/groff/groff-1.24.1.tar.gz"
]
sha256 = [
    "f9c1efd5bebbe37fc6e1063db7473ce8df1e3e0be4ff0f43ce04fce57e9c5dd9"
]

[build]
type = "autotools"
script = """
cd "${srcdir}/groff-${pkgver}"
./configure --prefix=/usr --without-x
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
