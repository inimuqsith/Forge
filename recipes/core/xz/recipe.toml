[package]
name = "xz"
version = "5.8.4"
release = 1
slot = "0"
description = "Free general-purpose data compression software with high compression ratio (LZMA2)"
license = "GPL-2.0-or-later AND LGPL-2.1-or-later"
upstream = "https://tukaani.org/xz/"

[dependencies]
runtime = ["glibc"]
build = ["make", "gcc"]

[sources]
urls = [
    "https://github.com/tukaani-project/xz/releases/download/v5.8.4/xz-5.8.4.tar.xz"
]
sha256 = ["4ce24038fd4221e0d13bc1a2de7a4db56e90b92b3bf75321f6c14be73f65de4b"]

[build]
type = "autotools"
script = """
cd "${srcdir}/xz-${pkgver}"
./configure --prefix=/usr --disable-static
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
