[package]
name = "liburcu"
version = "0.15.0"
release = 1
slot = "0"
description = "Userspace RCU (read-copy-update) library"
license = "LGPL-2.1-or-later"
upstream = "https://lttng.org/urcu/"

[dependencies]
runtime = ["glibc"]
build = ["make", "gcc"]

[sources]
urls = [
    "https://lttng.org/files/urcu/userspace-rcu-0.15.0.tar.bz2"
]
sha256 = [
    "4f2d839af67905ad396d6d53ba5649b66113d90840dcbc89941e0da64bccd38c"
]

[build]
type = "autotools"
script = """
cd "${srcdir}/userspace-rcu-${pkgver}"
./configure --prefix=/usr --disable-static
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
