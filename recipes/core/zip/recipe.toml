[package]
name = "zip"
version = "9.0.1"
release = 1
slot = "0"
description = "Compressor utility for zipfile archives"
license = "Info-ZIP"
upstream = "http://infozip.sourceforge.net/Zip.html"

[dependencies]
runtime = ["glibc", "bzip2"]
build = ["make", "gcc"]

[sources]
urls = [
    "https://downloads.sourceforge.net/infozip/zip30.tar.gz"
]
sha256 = [
    "f0e8bb1f9b7eb0b01285495a2699df3a4b766784c1765a8f1aeedf63c0806369"
]

[build]
type = "make"
script = """
cd "${srcdir}/zip30"
make -f unix/Makefile generic ${MAKEFLAGS}
make -f unix/Makefile prefix="${DESTDIR}/usr" MANDIR="${DESTDIR}/usr/share/man/man1" install
"""
