[package]
name = "bash"
version = "5.3"
release = 1
slot = "0"
description = "GNU Bourne Again SHell"
license = "GPL-3.0-or-later"
upstream = "https://www.gnu.org/software/bash/"

[dependencies]
runtime = [
    "glibc",
    "readline",
    "ncurses",
]
build = [
    "make",
    "gcc",
    "bison",
    "pkgconf",
]

[sources]
urls = [
    "https://ftp.gnu.org/gnu/bash/bash-5.3.tar.gz",
]
sha256 = ["0d5cd86965f869a26cf64f4b71be7b96f90a3ba8b3d74e27e8e9d9d5550f31ba"]

[build]
type = "autotools"
script = """
cd "${srcdir}/bash-${pkgver}"
./configure --prefix=/usr --with-installed-readline --without-bash-malloc
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
ln -sf bash "${DESTDIR}/usr/bin/sh"
"""
