[package]
name = "zstd"
version = "1.5.7-kernel"
release = 1
slot = "0"
description = "Zstandard - Fast real-time compression algorithm"
license = "BSD-3-Clause OR GPL-2.0-only"
upstream = "https://facebook.github.io/zstd/"

[dependencies]
runtime = ["glibc", "zlib", "xz"]
build = ["make", "gcc", "pkgconf"]

[sources]
urls = [
    "https://github.com/facebook/zstd/archive/refs/tags/v1.5.7-kernel.tar.gz"
]
sha256 = [
    "be2393171a011d80539e5d243df61c4a63c035923e5b31614a757e77dbcd841a"
]

[build]
type = "make"
script = """
cd "${srcdir}/zstd-${pkgver}"
make PREFIX=/usr ${MAKEFLAGS}
make PREFIX=/usr DESTDIR="${DESTDIR}" install
"""
