[package]
name = "libseccomp"
version = "2.6.2"
release = 1
slot = "0"
description = "Enhanced Seccomp library and kernel syscall filtering interface"
license = "LGPL-2.1-only"
upstream = "https://github.com/seccomp/libseccomp"

[dependencies]
runtime = ["glibc"]
build = ["make", "gcc"]

[sources]
urls = [
    "https://github.com/seccomp/libseccomp/releases/download/v2.6.1/libseccomp-2.6.1.tar.gz"
]
sha256 = [
    "6b845d352c6d7887d8d134c43d86850d40f5dcee11ad1675c18197ae4d869d42"
]

[build]
type = "autotools"
script = """
cd "${srcdir}/libseccomp-${pkgver}"
./configure --prefix=/usr --disable-static
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
