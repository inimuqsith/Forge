[package]
name = "usbutils"
version = "020"
release = 1
slot = "0"
description = "USB device listing and inspection utilities (lsusb)"
license = "GPL-2.0-or-later"
upstream = "http://linux-usb.sourceforge.net/"

[dependencies]
runtime = ["glibc", "hwdata"]
build = ["make", "gcc", "pkgconf"]

[sources]
urls = [
    "https://kernel.org/pub/linux/utils/usb/usbutils/usbutils-019.tar.xz"
]
sha256 = [
    "20287d68fcd9ebb50a05ba0645a4af7583bd8dfc7307215ba121e4bc6d057aa1"
]

[build]
type = "autotools"
script = """
cd "${srcdir}/usbutils-${pkgver}"
./configure --prefix=/usr --datadir=/usr/share/hwdata
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
