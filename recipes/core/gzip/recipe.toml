[package]
name = "gzip"
version = "1.14"
release = 1
slot = "0"
description = "Popular data compression program"
license = "GPL-3.0-or-later"
upstream = "https://www.gnu.org/software/gzip/"

[dependencies]
runtime = [
    "glibc",
]
build = [
    "make",
    "gcc",
]

[sources]
urls = [
    "https://ftp.gnu.org/gnu/gzip/gzip-1.14.tar.xz",
]
sha256 = ["01a7b881bd220bfdf615f97b8718f80bdfd3f6add385b993dcf6efd14e8c0ac6"]

[build]
type = "autotools"
script = """
cd "${srcdir}/gzip-${pkgver}"
./configure --prefix=/usr
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
