[package]
name = "gzip"
version = "1.13"
release = 1
slot = "0"
description = "Popular data compression program"
license = "GPL-3.0-or-later"
upstream = "https://www.gnu.org/software/gzip/"

[dependencies]
runtime = [
    "glibc",
]
build = [
    "make",
    "gcc",
]

[sources]
urls = [
    "https://ftp.gnu.org/gnu/gzip/gzip-1.13.tar.xz",
]
sha256 = []

[build]
type = "autotools"
script = """
cd "${srcdir}/gzip-${pkgver}"
./configure --prefix=/usr
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
