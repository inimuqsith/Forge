[package]
name = "gzip"
version = "1.15"
release = 1
slot = "0"
description = "Popular data compression program"
license = "GPL-3.0-or-later"
upstream = "https://www.gnu.org/software/gzip/"

[dependencies]
runtime = ["glibc"]
build = ["make", "gcc"]

[sources]
urls = [
    "https://ftp.gnu.org/gnu/gzip/gzip-1.15.tar.xz"
]
sha256 = [
    "9aa0cc780dec156b8282844833b342ab7cb08c25d2cd9a1869cdd0df31deff48"
]

[build]
type = "autotools"
script = """
cd "${srcdir}/gzip-${pkgver}"
./configure --prefix=/usr
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
