[package]
name = "libedit"
version = "20260512-3.1"
release = 1
slot = "0"
description = "NetBSD Editline library (BSD-licensed alternative to GNU readline)"
license = "BSD-3-Clause"
upstream = "https://www.thrysoee.dk/editline/"

[dependencies]
runtime = ["glibc", "ncurses"]
build = ["make", "gcc"]

[sources]
urls = [
    "https://www.thrysoee.dk/editline/libedit-20260512-3.1.tar.gz"
]
sha256 = [
    "432d5e7ea8b0116dd39f2eca7bc11d0eed77faa6b77ea526ace89907c23ea4a0"
]

[build]
type = "autotools"
script = """
cd "${srcdir}/libedit-${pkgver}"
./configure --prefix=/usr --enable-widec --disable-static
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
