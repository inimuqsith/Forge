[package]
name = "lzo"
version = "2.10"
release = 1
slot = "0"
description = "Portable lossless data compression library"
license = "GPL-2.0-or-later"
upstream = "https://www.oberhumer.com/opensource/lzo/"

[dependencies]
runtime = ["glibc"]
build = ["make", "gcc"]

[sources]
urls = [
    "https://www.oberhumer.com/opensource/lzo/download/lzo-2.10.tar.gz"
]
sha256 = [
    "c0f892943208266f9b6543b3ae308fab6284c5c90e627931446fb49b4221a072"
]

[build]
type = "autotools"
script = """
cd "${srcdir}/lzo-${pkgver}"
./configure --prefix=/usr --enable-shared --disable-static --docdir=/usr/share/doc/lzo-2.10
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
