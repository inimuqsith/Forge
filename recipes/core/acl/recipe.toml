[package]
name = "acl"
version = "2.4.0"
release = 1
slot = "0"
description = "Access control list utilities and library"
license = "GPL-2.0-or-later AND LGPL-2.1-or-later"
upstream = "https://savannah.nongnu.org/projects/acl"

[dependencies]
runtime = ["glibc", "attr"]
build = ["make", "gcc"]

[sources]
urls = [
    "https://download.savannah.nongnu.org/releases/acl/acl-2.4.0.tar.xz"
]
sha256 = ["e661131456d2708a01c614a0f400e11d7d1bfaeb6f3e74b75bb980b72f0161a3"]

[build]
type = "autotools"
script = """
cd "${srcdir}/acl-${pkgver}"
./configure --prefix=/usr --disable-static
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
