[package]
name = "bzip2"
version = "1.0.8"
release = 1
slot = "0"
description = "A high-quality data compression program"
license = "bzip2-1.0.6"
upstream = "https://sourceware.org/bzip2/"

[dependencies]
runtime = ["glibc"]
build = []

[sources]
urls = [
    "https://sourceware.org/pub/bzip2/bzip2-1.0.8.tar.gz"
]
sha256 = ["ab5a03176ee106d3f0fa90e381da478ddae405918153cca248e682cd0c4a2269"]

[build]
type = "make"
script = """
cd "${srcdir}/bzip2-${pkgver}"
make -f Makefile-libbz2_so CC="${CC:-clang}" ${MAKEFLAGS}
make CC="${CC:-clang}" ${MAKEFLAGS}
make PREFIX="${DESTDIR}/usr" install
cp -a libbz2.so* "${DESTDIR}/usr/lib/"
"""
