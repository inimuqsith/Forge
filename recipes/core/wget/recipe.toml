[package]
name = "wget"
version = "1.25.0"
release = 1
slot = "0"
description = "Network utility to retrieve files from the Web using HTTP, HTTPS and FTP"
license = "GPL-3.0-or-later"
upstream = "https://www.gnu.org/software/wget/"

[dependencies]
runtime = [
    "glibc",
    "openssl",
    "pcre2",
    "zlib",
]
build = [
    "make",
    "gcc",
    "pkgconf",
]

[sources]
urls = [
    "https://ftp.gnu.org/gnu/wget/wget-1.25.0.tar.gz",
]
sha256 = []

[build]
type = "autotools"
script = """
cd "${srcdir}/wget-${pkgver}"
./configure --prefix=/usr --sysconfdir=/etc --with-ssl=openssl --with-libpcre2
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
