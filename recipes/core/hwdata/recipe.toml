[package]
name = "hwdata"
version = "0.412"
release = 1
slot = "0"
description = "Hardware identification databases (pci.ids, usb.ids, oui.txt)"
license = "GPL-2.0-or-later"
upstream = "https://github.com/vcrhonek/hwdata"

[dependencies]
runtime = ["glibc"]
build = ["make"]

[sources]
urls = [
    "https://github.com/vcrhonek/hwdata/archive/refs/tags/v0.411.tar.gz"
]
sha256 = [
    "f0c64cd7e31d70a5fb3a52e53ab50a61e74c0421a6381eaa45114eec3bde5fe7"
]

[build]
type = "autotools"
script = """
cd "${srcdir}/hwdata-${pkgver}"
./configure --prefix=/usr --sysconfdir=/etc --datadir=/usr/share
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
