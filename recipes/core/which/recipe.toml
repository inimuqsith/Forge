[package]
name = "which"
version = "2.25"
release = 1
slot = "0"
description = "Displays where a particular program is found in the path"
license = "GPL-3.0-or-later"
upstream = "https://savannah.gnu.org/projects/which/"

[dependencies]
runtime = ["glibc"]
build = ["make", "gcc"]

[sources]
urls = [
    "https://ftp.gnu.org/gnu/which/which-2.25.tar.gz"
]
sha256 = [
    "1cb83e4f702e60b8211ab5ec4c2afbab1b1dec80209456a7d2faf7584ed225ea"
]

[build]
type = "autotools"
script = """
cd "${srcdir}/which-${pkgver}"
./configure --prefix=/usr
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
