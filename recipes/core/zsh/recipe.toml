[package]
name = "zsh"
version = "5.9.2"
release = 1
slot = "0"
description = "Advanced programmable command interpreter"
license = "MIT-Modern-Variant"
upstream = "https://www.zsh.org/"

[dependencies]
runtime = ["glibc", "ncurses", "pcre2"]
build = ["make", "gcc", "pkgconf"]

[sources]
urls = [
    "https://www.zsh.org/pub/zsh-5.9.2.tar.xz"
]
sha256 = ["36fa734374b44783582cec09bcd67822e2f992c779ec1624ab5596df078d2f81"]

[build]
type = "autotools"
script = """
cd "${srcdir}/zsh-${pkgver}"
./configure --prefix=/usr --enable-pcre --enable-cap --enable-multibyte
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
