[package]
name = "ca-certificates"
version = "20260909"
release = 1
slot = "0"
description = "Common CA root certificates bundle from Mozilla"
license = "MPL-2.0"
upstream = "https://curl.se/docs/caextract.html"

[dependencies]
runtime = [
    "openssl",
]
build = [
    "python",
]

[sources]
urls = [
    "https://curl.se/ca/cacert-2024-11-26.pem",
]
sha256 = ["bb1782d281fe60d4a2dcf41bc229abe3e46c280212597d4abcc25bddf667739b"]

[build]
type = "custom"
script = """
mkdir -p "${DESTDIR}/etc/ssl/certs"
cp "${srcdir}/cacert-2024-11-26.pem" "${DESTDIR}/etc/ssl/certs/ca-certificates.crt"
ln -sf certs/ca-certificates.crt "${DESTDIR}/etc/ssl/cert.pem"
"""
