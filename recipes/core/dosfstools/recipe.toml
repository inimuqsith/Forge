[package]
name = "dosfstools"
version = "4.2"
release = 5
slot = "0"
description = "DOS filesystem utilities"
license = "GPL-2.0-or-later"
upstream = "https://github.com/dosfstools/dosfstools"

[dependencies]
runtime = ["glibc"]
build = ["gcc"]

[sources]
urls = [
    "https://github.com/dosfstools/dosfstools/releases/download/v4.2/dosfstools-4.2.tar.gz"
]
sha256 = ["64926eebf90092dca21b14259a5301b7b98e7b1943e8a201c7d726084809b527", "b9953dde3d755a6e9a31a28e2a7aebccd0b5ed9bcc664893bd55290945589b5b"]

[build]
type = "autotools"
script = """
cd "${srcdir}/dosfstools-${pkgver}"
./configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var --disable-static
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
