[package]
name = "iproute2"
version = "7.2.0"
release = 1
slot = "0"
description = "IP routing and network device configuration suite (ip, ss, tc)"
license = "GPL-2.0-only"
upstream = "https://wiki.linuxfoundation.org/networking/iproute2"

[dependencies]
runtime = ["glibc", "libcap", "libseccomp"]
build = ["make", "gcc", "bison", "flex", "pkgconf"]

[sources]
urls = [
    "https://kernel.org/pub/linux/utils/net/iproute2/iproute2-7.2.0.tar.xz"
]
sha256 = ["4c2fa124c2cf0afd7ca34d1eeacba6ba048a56f6374e2aab93dafbdbd4eea9c0"]

[build]
type = "make"
script = """
cd "${srcdir}/iproute2-${pkgver}"
./configure --prefix=/usr --sysconfdir=/etc
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
