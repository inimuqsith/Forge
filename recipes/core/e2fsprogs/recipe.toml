[package]
name = "e2fsprogs"
version = "1.47.2"
release = 1
slot = "0"
description = "Ext2/3/4 filesystem management utilities (mke2fs, fsck.ext4)"
license = "GPL-2.0-or-later AND LGPL-2.0-or-later"
upstream = "http://e2fsprogs.sourceforge.net/"

[dependencies]
runtime = [
    "glibc",
    "util-linux",
]
build = [
    "make",
    "gcc",
    "pkgconf",
]

[sources]
urls = [
    "https://kernel.org/pub/linux/kernel/people/tytso/e2fsprogs/v1.47.2/e2fsprogs-1.47.2.tar.xz",
]
sha256 = []

[build]
type = "autotools"
script = """
cd "${srcdir}/e2fsprogs-${pkgver}"
mkdir -p build && cd build
../configure --prefix=/usr --sysconfdir=/etc --enable-elf-shlibs --disable-libblkid --disable-libuuid --disable-fsck
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
