[package]
name = "dbus"
version = "1.16.4"
release = 1
slot = "0"
description = "Freedesktop.org message bus system"
license = "GPL-2.0-or-later"
upstream = "https://www.freedesktop.org/wiki/Software/dbus/"

[dependencies]
runtime = ["glibc", "expat", "libcap-ng", "eudev"]
build = ["gcc", "meson", "ninja", "pkgconf", "glib2", "python"]

[sources]
urls = [
    "https://dbus.freedesktop.org/releases/dbus/dbus-1.16.2.tar.xz"
]
sha256 = [
    "d08b05526c2cb7966a5fb79210d6112b1aca3d135f315c1b302e14b4b0297dac"
]

[build]
type = "meson"
script = """
cd "${srcdir}/dbus-${pkgver}"
meson setup build --prefix=/usr --buildtype=release
ninja -C build ${MAKEFLAGS}
DESTDIR="${DESTDIR}" ninja -C build install
"""
