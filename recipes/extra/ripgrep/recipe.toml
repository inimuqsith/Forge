[package]
name = "ripgrep"
version = "15.2.0"
release = 1
slot = "0"
description = "Ultra-fast line-oriented search tool combining grep with find"
license = "MIT OR Unlicense"
upstream = "https://github.com/BurntSushi/ripgrep"

[dependencies]
runtime = ["glibc", "pcre2"]
build = ["cargo", "rust", "pkgconf"]

[sources]
urls = [
    "https://github.com/BurntSushi/ripgrep/archive/refs/tags/15.2.0.tar.gz"
]
sha256 = ["7605249d3eb0d5f170e3414498e3344e26b1e7a147aec518b57090b80036a562"]

[build]
type = "cargo"
script = """
cd "${srcdir}/ripgrep-${pkgver}"
cargo build --release --features pcre2
install -Dm755 target/release/rg "${DESTDIR}/usr/bin/rg"
"""
