[package]
name = "libffi"
version = "3.8.0"
release = 1
slot = "0"
description = "Portable foreign function interface library"
license = "MIT"
upstream = "https://sourceware.org/libffi/"

[dependencies]
runtime = ["glibc"]
build = ["make", "gcc"]

[sources]
urls = [
    "https://github.com/libffi/libffi/releases/download/v3.8.0/libffi-3.8.0.tar.gz"
]
sha256 = ["7da3e2d9a171eb0a038f592ecad3ff2bb2550f3496d87b3b29ad0cf4430c0db4"]

[build]
type = "autotools"
script = """
cd "${srcdir}/libffi-${pkgver}"
./configure --prefix=/usr --disable-static
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
