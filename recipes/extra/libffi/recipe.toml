[package]
name = "libffi"
version = "3.8.1"
release = 1
slot = "0"
description = "Portable foreign function interface library"
license = "MIT"
upstream = "https://sourceware.org/libffi/"

[dependencies]
runtime = ["glibc"]
build = ["make", "gcc"]

[sources]
urls = [
    "https://github.com/libffi/libffi/releases/download/v3.8.0/libffi-3.8.0.tar.gz"
]
sha256 = [
    "81e879c094cc5ec3186c48510c6385ac6b3e866192e8bc71a35245703757ee40"
]

[build]
type = "autotools"
script = """
cd "${srcdir}/libffi-${pkgver}"
./configure --prefix=/usr --disable-static
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
