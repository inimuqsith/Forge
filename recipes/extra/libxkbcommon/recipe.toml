[package]
name = "libxkbcommon"
version = "1.13.2"
release = 1
slot = "0"
description = "Keyboard description compilation and handling library"
license = "MIT"
upstream = "https://github.com/xkbcommon/libxkbcommon"

[dependencies]
runtime = ["glibc", "xkeyboard-config"]
build = ["meson", "ninja", "pkgconf", "bison", "wayland", "wayland-protocols"]

[sources]
urls = [
  "https://github.com/xkbcommon/libxkbcommon/archive/refs/tags/xkbcommon-1.13.2.tar.gz"
]
sha256 = [
  "acc4d5f7c3cbba5f9f8d08d8bdbeede84ecede46792f47929aa9321873385528"
]

[build]
type = "meson"
script = """
meson setup build \
  --prefix=/usr \
  --sysconfdir=/etc \
  --buildtype=release \
  -Denable-docs=false \
  -Denable-wayland=true

ninja -C build
DESTDIR="${DESTDIR}" ninja -C build install
"""
