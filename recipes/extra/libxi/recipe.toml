[package]
name = "libxi"
version = "1.8.3"
release = 1
slot = "0"
description = "X11 Input extension library"
license = "MIT"
upstream = "https://xorg.freedesktop.org/"

[dependencies]
runtime = ["glibc", "libxcb"]
build = ["make", "gcc", "pkgconf"]

[sources]
urls = [
    "https://xorg.freedesktop.org/archive/individual/lib/libXi-1.8.3.tar.xz"
]
sha256 = [
    "7ad60056f01af4f786cfe93b3a7707447711626fc8da2637bec71a90409babe5"
]

[build]
type = "autotools"
script = """
cd "${srcdir}/libXi-${pkgver}"
./configure --prefix=/usr --disable-static
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
