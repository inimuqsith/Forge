[package]
name = "git"
version = "2.55.0"
release = 1
slot = "0"
description = "Fast, scalable, distributed revision control system"
license = "GPL-2.0-only"
upstream = "https://git-scm.com/"

[dependencies]
runtime = [
    "glibc",
    "curl",
    "openssl",
    "zlib",
    "expat",
    "pcre2",
]
build = [
    "make",
    "gcc",
    "pkgconf",
]

[sources]
urls = [
    "https://www.kernel.org/pub/software/scm/git/git-2.55.0.tar.xz",
]
sha256 = ["457fdb04dc8728e007d4688695e6912e6f680727920f2a40bf11eacc17505357"]

[build]
type = "make"
script = """
cd "${srcdir}/git-${pkgver}"
make prefix=/usr NO_PERL=1 NO_TCLTK=1 USE_LIBPCRE2=1 ${MAKEFLAGS}
make prefix=/usr NO_PERL=1 NO_TCLTK=1 DESTDIR="${DESTDIR}" install
"""
