[package]
name = "wayland"
version = "1.26.0"
release = 1
slot = "0"
description = "A computer display server protocol"
license = "GPL-2.0-or-later"
upstream = "https://wayland.freedesktop.org/"

[dependencies]
runtime = ["glibc", "libffi", "expat", "libxml2", "default-cursors"]
build = ["gcc", "meson", "libxslt", "doxygen", "xmlto", "graphviz", "docbook-xsl", "mdbook", "ninja"]

[sources]
urls = [
    "https://gitlab.freedesktop.org/wayland/wayland/-/releases/1.26.0/downloads/wayland-1.26.0.tar.xz"
]
sha256 = ["64176eaa46e4969903e286f8e5ef8331affc17fdf03ac9b58381d2b23162b7a3"]

[build]
type = "meson"
script = """
cd "${srcdir}/wayland-${pkgver}"
meson setup build --prefix=/usr --buildtype=release
ninja -C build ${MAKEFLAGS}
DESTDIR="${DESTDIR}" ninja -C build install
"""
