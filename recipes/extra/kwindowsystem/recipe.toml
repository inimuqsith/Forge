[package]
name = "kwindowsystem"
version = "6.30.0"
release = 1
description = "Access to the windowing system for KDE frameworks (Wayland and X11)"
license = "LGPL-2.0-or-later"
homepage = "https://invent.kde.org/frameworks/kwindowsystem"
slot = "6"

[dependencies]
depends = ["qt6-base", "qt6-wayland", "libxkbcommon", "wayland"]
makedepends = ["cmake", "ninja", "extra-cmake-modules", "pkgconf", "wayland-protocols"]

[sources]
urls = ["https://download.kde.org/stable/frameworks/6.30/kwindowsystem-6.30.0.tar.xz"]
sha256 = ["639a501b877446b19905399d27e2be2b6ebb0bb481abe3209dc4d535a12e12ca"]

[build]
configure = """
cmake -B build -G Ninja \
    -DCMAKE_BUILD_TYPE=Release \
    -DCMAKE_INSTALL_PREFIX=/usr \
    -DKWINDOWSYSTEM_NO_WIDGETS=OFF \
    -DBUILD_TESTING=OFF
"""
compile = """
cmake --build build -j$(nproc)
"""
install = """
DESTDIR="${DESTDIR}" cmake --install build
"""
