[package]
name = "kpipewire"
version = "6.7.5"
release = 1
description = "Components for Flatpak and PipeWire integration in KDE Plasma"
license = "LGPL-2.1-or-later OR LGPL-3.0-only"
homepage = "https://invent.kde.org/plasma/kpipewire"
slot = "6"

[dependencies]
depends = ["qt6-base", "qt6-declarative", "qt6-wayland", "kcoreaddons", "ki18n", "pipewire", "libdrm", "mesa"]
makedepends = ["cmake", "ninja", "extra-cmake-modules", "pkgconf", "wayland-protocols"]

[sources]
urls = ["https://download.kde.org/stable/plasma/6.7.5/kpipewire-6.7.5.tar.xz"]
sha256 = ["20af39d9450d495468c56a50930810d82137f7ccd3a710592e02b6f620758f55"]

[build]
configure = """
cmake -B build -G Ninja \
    -DCMAKE_BUILD_TYPE=Release \
    -DCMAKE_INSTALL_PREFIX=/usr \
    -DBUILD_TESTING=OFF
"""
compile = """
cmake --build build -j$(nproc)
"""
install = """
DESTDIR="${DESTDIR}" cmake --install build
"""
