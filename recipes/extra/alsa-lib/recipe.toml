[package]
name = "alsa-lib"
version = "1.2.16.1"
release = 1
slot = "0"
description = "Advanced Linux Sound Architecture (ALSA) core runtime library"
license = "LGPL-2.1-or-later"
upstream = "https://github.com/alsa-project/alsa-lib"

[dependencies]
runtime = ["glibc"]
build = ["autoconf", "automake", "libtool", "make", "pkgconf"]

[sources]
urls = [
  "https://github.com/alsa-project/alsa-lib/archive/refs/tags/v1.2.16.1.tar.gz"
]
sha256 = [
  "8df8253c6349cf309903c1dd7752efe783c1f456913c9d722bdb5731271c0988"
]

[build]
type = "autotools"
script = """
autoreconf -fiv
./configure \
  --prefix=/usr \
  --sysconfdir=/etc \
  --disable-static \
  --disable-python

make -j$(nproc)
make DESTDIR="${DESTDIR}" install
"""
