[package]
name = "tllist"
version = "1.1.0"
release = 1
slot = "0"
description = "C header-only implementation of a typed linked list"
license = "MIT"
upstream = "https://codeberg.org/dnkl/tllist"

[dependencies]
runtime = []
build = ["meson", "ninja", "pkgconf"]

[sources]
urls = [
    "https://codeberg.org/dnkl/tllist/releases/download/1.1.0/tllist-1.1.0.tar.gz"
]
sha256 = [
    "a1f0ce0dc4fcb4ce59c37202a1d914c853a8bd2d7c5d57d623b15a8dd9778767"
]

[build]
type = "meson"
script = """
cd "${srcdir}/tllist"
meson setup build --prefix=/usr --buildtype=release -Ddocs=disabled
ninja -C build -j${FORGE_JOBS:-$(nproc)}
DESTDIR="${DESTDIR}" ninja -C build install
"""
