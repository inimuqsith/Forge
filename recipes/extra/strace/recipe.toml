[package]
name = "strace"
version = "7.3"
release = 1
slot = "0"
description = "Diagnostic, debugging and instructional userspace utility for Linux syscall tracing"
license = "LGPL-2.1-or-later"
upstream = "https://strace.io/"

[dependencies]
runtime = ["glibc"]
build = ["make", "gcc"]

[sources]
urls = [
    "https://github.com/strace/strace/releases/download/v7.2/strace-7.2.tar.xz"
]
sha256 = [
    "529634c40910895a9a1f3c5c1e65da2ca9ed72fb158dfc4bcc89efdf05e39b72"
]

[build]
type = "autotools"
script = """
cd "${srcdir}/strace-${pkgver}"
./configure --prefix=/usr
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
