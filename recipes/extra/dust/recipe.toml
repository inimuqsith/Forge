[package]
name = "dust"
version = "1.2.7"
release = 1
slot = "0"
description = "A more intuitive version of du in rust"
license = "Apache-2.0"
upstream = "https://github.com/bootandy/dust"

[dependencies]
runtime = ["glibc", "gcc"]
build = ["gcc", "git", "rust"]

[sources]
urls = [
    "https://github.com/bootandy/dust/archive/refs/tags/v1.2.6.tar.gz"
]
sha256 = [
    "923a2eed637d2ea5f4ad5f820b6f87cc6e0081cfa4bc5ed1fe09278dd74db963"
]

[build]
type = "cargo"
script = """
cd "${srcdir}/dust-${pkgver}"
cargo build --release --locked
install -Dm755 "target/release/dust" "${DESTDIR}/usr/bin/dust"
"""
