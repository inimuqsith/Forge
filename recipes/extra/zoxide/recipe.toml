[package]
name = "zoxide"
version = "0.10.0"
release = 1
slot = "0"
description = "A smarter cd command for your terminal"
license = "GPL-2.0-or-later"
upstream = "https://github.com/ajeetdsouza/zoxide"

[dependencies]
runtime = ["glibc"]
build = ["gcc", "git", "rust"]

[sources]
urls = [
    "https://github.com/ajeetdsouza/zoxide/archive/refs/tags/v0.10.0.tar.gz"
]
sha256 = ["4fcd4272b013a10b637dbcc299c58a9924b94470a9042677ca1a204cc2e9150e"]

[build]
type = "cargo"
script = """
cd "${srcdir}/zoxide-${pkgver}"
cargo build --release --locked
install -Dm755 "target/release/zoxide" "${DESTDIR}/usr/bin/zoxide"
"""
