[package]
name = "libdrm"
version = "2.4.134"
release = 1
slot = "0"
description = "Userspace interface to kernel DRM services"
license = "MIT"
upstream = "https://dri.freedesktop.org/libdrm/"

[dependencies]
runtime = ["glibc", "libpciaccess"]
build = ["meson", "ninja", "pkgconf"]

[sources]
urls = [
  "https://dri.freedesktop.org/libdrm/libdrm-2.4.134.tar.xz"
]
sha256 = [
  "ac5e74d157830eb8bee44c6a6bf3ad49774ef0dd2a72bdad74a8f20308b52a95"
]

[build]
type = "meson"
script = """
meson setup build \
  --prefix=/usr \
  --sysconfdir=/etc \
  --buildtype=release \
  -Dudev=true \
  -Dvalgrind=disabled

ninja -C build
DESTDIR="${DESTDIR}" ninja -C build install
"""
