[package]
name = "libxrandr"
version = "1.5.4"
release = 1
slot = "0"
description = "X11 RandR extension library"
license = "MIT"
upstream = "https://xorg.freedesktop.org/"

[dependencies]
runtime = ["glibc", "libxcb"]
build = ["make", "gcc", "pkgconf"]

[sources]
urls = [
    "https://xorg.freedesktop.org/archive/individual/lib/libXrandr-1.5.4.tar.xz"
]
sha256 = [
    "1ad5b065375f4a85915aa60611cc6407c060492a214d7f9daf214be752c3b4d3"
]

[build]
type = "autotools"
script = """
cd "${srcdir}/libXrandr-${pkgver}"
./configure --prefix=/usr --disable-static
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
