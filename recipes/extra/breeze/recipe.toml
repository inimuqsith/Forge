[package]
name = "breeze"
version = "6.7.5"
release = 1
description = "Artwork, styles and assets for the Breeze visual theme"
license = "GPL-2.0-or-later"
upstream = "https://invent.kde.org/plasma/breeze"
slot = "6"

[dependencies]
runtime = ["qt6-base", "qt6-declarative", "kcoreaddons", "kconfig", "kwidgetsaddons", "kwindowsystem"]
build = ["cmake", "ninja", "extra-cmake-modules", "pkgconf"]

[sources]
urls = ["https://download.kde.org/stable/plasma/6.7.5/breeze-6.7.5.tar.xz"]
sha256 = ["aa05c0c31c852ed5b137327e7798fd763a54c643875d5d8070625475e0af6976"]

[build]
configure = """
cmake -B build -G Ninja \
    -DCMAKE_BUILD_TYPE=Release \
    -DCMAKE_INSTALL_PREFIX=/usr \
    -DBUILD_TESTING=OFF
"""
compile = """
cmake --build build -j$(nproc)
"""
install = """
DESTDIR="${DESTDIR}" cmake --install build
"""
