[package]
name = "freetype"
version = "2.14.3"
release = 1
slot = "0"
description = "Freely available software library to render fonts"
license = "FTL"
upstream = "https://www.freetype.org/"

[dependencies]
runtime = ["glibc", "zlib", "bzip2", "libpng"]
build = ["meson", "ninja", "pkgconf"]

[sources]
urls = [
  "https://download.savannah.gnu.org/releases/freetype/freetype-2.14.3.tar.xz"
]
sha256 = [
  "36bc4f1cc413335368ee656c42afca65c5a3987e8768cc28cf11ba775e785a5f"
]

[build]
type = "meson"
script = """
meson setup build \
  --prefix=/usr \
  --sysconfdir=/etc \
  --buildtype=release \
  -Dzlib=enabled \
  -Dbzip2=enabled \
  -Dpng=disabled \
  -Dharfbuzz=disabled

ninja -C build
DESTDIR="${DESTDIR}" ninja -C build install
"""
