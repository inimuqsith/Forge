[package]
name = "freetype"
version = "2.15.0"
release = 1
slot = "0"
description = "Freely available software library to render fonts"
license = "FTL"
upstream = "https://www.freetype.org/"

[dependencies]
runtime = ["glibc", "zlib", "bzip2", "libpng"]
build = ["meson", "ninja", "pkgconf"]

[sources]
urls = [
  "https://download.savannah.gnu.org/releases/freetype/freetype-2.14.3.tar.xz"
]
sha256 = [
    "93cd47eb719c325107f2d3cf087d06299e944c3b48a40b55537302304dea1dd5"
]

[build]
type = "meson"
script = """
meson setup build \
  --prefix=/usr \
  --sysconfdir=/etc \
  --buildtype=release \
  -Dzlib=enabled \
  -Dbzip2=enabled \
  -Dpng=disabled \
  -Dharfbuzz=disabled

ninja -C build
DESTDIR="${DESTDIR}" ninja -C build install
"""
