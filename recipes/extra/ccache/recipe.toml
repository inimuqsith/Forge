[package]
name = "ccache"
version = "4.14"
release = 1
slot = "0"
description = "Fast compiler cache for C/C++"
license = "GPL-3.0-or-later"
upstream = "https://ccache.dev/"

[dependencies]
runtime = [
    "glibc",
    "zstd",
]
build = [
    "cmake",
    "ninja",
    "gcc",
    "pkgconf",
]

[sources]
urls = [
    "https://github.com/ccache/ccache/releases/download/v4.14/ccache-4.14.tar.xz",
]
sha256 = ["b093ac5d38204cb4d9f29b0bbd570675aa5a592a78e6675b2c506dbe045234e7"]

[build]
type = "cmake"
script = """
cd "${srcdir}/ccache-${pkgver}"
cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DREDIS_STORAGE_BACKEND=OFF
ninja -C build ${MAKEFLAGS}
DESTDIR="${DESTDIR}" ninja -C build install
"""
