[package]
name = "libpng"
version = "1.6.58"
release = 1
slot = "0"
description = "Official PNG reference library"
license = "Libpng"
upstream = "http://www.libpng.org/pub/png/libpng.html"

[dependencies]
runtime = ["glibc", "zlib"]
build = ["make", "gcc"]

[sources]
urls = [
    "https://download.sourceforge.net/libpng/libpng-1.6.47.tar.xz"
]
sha256 = [
    "28eb403f51f0f7405249132cecfe82ea5c0ef97f1b32c5a65828814ae0d34775"
]

[build]
type = "autotools"
script = """
cd "${srcdir}/libpng-${pkgver}"
./configure --prefix=/usr --disable-static
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
