[package]
name = "libxslt"
version = "1.1.42"
release = 1
slot = "0"
description = "XML stylesheet transformation library (XSLT)"
license = "MIT"
upstream = "https://gitlab.gnome.org/GNOME/libxslt"

[dependencies]
runtime = [
    "glibc",
    "libxml2",
]
build = [
    "make",
    "gcc",
    "pkgconf",
]

[sources]
urls = [
    "https://download.gnome.org/sources/libxslt/1.1/libxslt-1.1.42.tar.xz",
]
sha256 = []

[build]
type = "autotools"
script = """
cd "${srcdir}/libxslt-${pkgver}"
./configure --prefix=/usr --without-python
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
