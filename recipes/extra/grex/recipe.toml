[package]
name = "grex"
version = "1.4.6"
release = 2
slot = "0"
description = "A command-line tool for generating regular expressions from user-provided input strings"
license = "GPL-2.0-or-later"
upstream = "https://github.com/pemistahl/grex"

[dependencies]
runtime = ["glibc", "gcc"]
build = ["gcc", "cargo"]

[sources]
urls = [
    "https://github.com/pemistahl/grex/archive/refs/tags/v1.4.6.tar.gz"
]
sha256 = ["2ab9cb4c3d921711f23ea33a9e60dc11e9eaab450b16d1f2247bea2276822433"]

[build]
type = "cargo"
script = """
cd "${srcdir}/grex-${pkgver}"
cargo build --release --locked
install -Dm755 "target/release/grex" "${DESTDIR}/usr/bin/grex"
"""
