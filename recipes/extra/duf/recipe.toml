[package]
name = "duf"
version = "0.9.1"
release = 1
slot = "0"
description = "Disk Usage/Free Utility"
license = "MIT"
upstream = "https://github.com/muesli/$pkgname"

[dependencies]
runtime = ["glibc"]
build = ["gcc", "git", "go"]

[sources]
urls = [
    "https://github.com/duf/duf/archive/refs/tags/v0.9.1.tar.gz"
]
sha256 = ["1334d8c1a7957d0aceebe651e3af9e1c1e0c6f298f1feb39643dd0bd8ad1e955"]

[build]
type = "custom"
script = """
cd "${srcdir}/duf-${pkgver}"
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
