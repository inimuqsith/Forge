[package]
name = "tree"
version = "2.3.2"
release = 1
slot = "0"
description = "Recursive directory indentation and tree-format listing program"
license = "GPL-2.0-or-later"
upstream = "http://mama.indstate.edu/users/ice/tree/"

[dependencies]
runtime = ["glibc"]
build = ["make", "gcc"]

[sources]
urls = [
    "https://gitlab.com/OldManProgrammer/unix-tree/-/archive/2.3.2/unix-tree-2.3.2.tar.gz"
]
sha256 = ["513a53cbc42ca1f4ea06af2bab1f5283524a3848266b1d162416f8033afc4985"]

[build]
type = "make"
script = """
cd "${srcdir}/unix-tree-${pkgver}"
make PREFIX=/usr ${MAKEFLAGS}
make PREFIX=/usr DESTDIR="${DESTDIR}" install
"""
