[package]
name = "layer-shell-qt"
version = "6.7.5"
release = 1
description = "Qt component for Wayland wl-layer-shell protocol integration"
license = "LGPL-2.1-or-later OR LGPL-3.0-only"
upstream = "https://invent.kde.org/plasma/layer-shell-qt"
slot = "6"

[dependencies]
runtime = ["qt6-base", "qt6-declarative", "qt6-wayland", "wayland"]
build = ["cmake", "ninja", "extra-cmake-modules", "pkgconf", "wayland-protocols"]

[sources]
urls = ["https://download.kde.org/stable/plasma/6.7.5/layer-shell-qt-6.7.5.tar.xz"]
sha256 = ["ccdcfec7081ca956f7a52c9113a4df3a226575bfbe98b56a2a9a4d7d7e19e8f0"]

[build]
configure = """
cmake -B build -G Ninja \
    -DCMAKE_BUILD_TYPE=Release \
    -DCMAKE_INSTALL_PREFIX=/usr \
    -DBUILD_TESTING=OFF
"""
compile = """
cmake --build build -j$(nproc)
"""
install = """
DESTDIR="${DESTDIR}" cmake --install build
"""
