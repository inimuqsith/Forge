[package]
name = "rust"
version = "1.99.0"
release = 1
slot = "0"
description = "Empowering everyone to build reliable and efficient systems programming language"
license = "Apache-2.0 OR MIT"
upstream = "https://www.rust-lang.org/"

[dependencies]
runtime = ["glibc", "llvm", "zlib", "openssl", "curl"]
build = ["python", "cmake", "ninja", "gcc", "make"]

[sources]
urls = [
    "https://static.rust-lang.org/dist/rustc-1.98.1-src.tar.xz",
    "https://static.rust-lang.org/dist/rustc-1.97.1-x86_64-unknown-linux-gnu.tar.xz",
    "https://static.rust-lang.org/dist/cargo-1.97.1-x86_64-unknown-linux-gnu.tar.xz",
    "https://static.rust-lang.org/dist/rust-std-1.97.1-x86_64-unknown-linux-gnu.tar.xz"
]
sha256 = [
    "cc41916a8c84f5d9ec4f55561b44e39f43b647b133f8a6f51be9ea13c83f7036"
]

[build]
type = "custom"
script = """
# Rakit toolchain stage0 lokal dari hasil ekstraksi tarball
mkdir -p "${srcdir}/stage0"
cp -a "${srcdir}"/rustc-1.97.1-*/rustc/* "${srcdir}/stage0/"
cp -a "${srcdir}"/cargo-1.97.1-*/cargo/* "${srcdir}/stage0/"
cp -a "${srcdir}"/rust-std-1.97.1-*/rust-std-x86_64-unknown-linux-gnu/* "${srcdir}/stage0/"

export PATH="${srcdir}/stage0/bin:${PATH}"
export LD_LIBRARY_PATH="${srcdir}/stage0/lib:${LD_LIBRARY_PATH}"

cd "${srcdir}/rustc-${pkgver}-src"
cat << EOF > config.toml
[llvm]
download-ci-llvm = false
link-shared = true
[rust]
channel = "stable"
rpath = false
[build]
rustc = "${srcdir}/stage0/bin/rustc"
cargo = "${srcdir}/stage0/bin/cargo"
vendor = true
extended = true
tools = ["cargo", "rustfmt", "clippy"]
docs = false
[install]
prefix = "/usr"
EOF

python3 ./x.py build -j ${MAKEFLAGS#-j}
DESTDIR="${DESTDIR}" python3 ./x.py install
"""
