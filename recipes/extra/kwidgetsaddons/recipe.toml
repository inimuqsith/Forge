[package]
name = "kwidgetsaddons"
version = "6.30.0"
release = 1
description = "Addons to QtWidgets providing diverse GUI widgets"
license = "LGPL-2.0-or-later"
upstream = "https://invent.kde.org/frameworks/kwidgetsaddons"
slot = "6"

[dependencies]
runtime = ["qt6-base"]
build = ["cmake", "ninja", "extra-cmake-modules", "pkgconf"]

[sources]
urls = ["https://download.kde.org/stable/frameworks/6.30/kwidgetsaddons-6.30.0.tar.xz"]
sha256 = ["ab1333c258678caa7562120a1c03bb71779f7232f1a0e75b9525d921dee3e0a3"]

[build]
configure = """
cmake -B build -G Ninja \
    -DCMAKE_BUILD_TYPE=Release \
    -DCMAKE_INSTALL_PREFIX=/usr \
    -DBUILD_TESTING=OFF
"""
compile = """
cmake --build build -j$(nproc)
"""
install = """
DESTDIR="${DESTDIR}" cmake --install build
"""
