[package]
name = "bottom"
version = "0.14.9"
release = 1
slot = "0"
description = "A graphical process/system monitor"
license = "MIT"
upstream = "https://github.com/ClementTsang/bottom"

[dependencies]
runtime = ["glibc", "gcc"]
build = ["gcc", "git", "rust"]

[sources]
urls = [
    "https://github.com/ClementTsang/bottom/archive/refs/tags/0.14.9.tar.gz"
]
sha256 = ["1dbb940c763fb583b7e1c7dfa165b73ed9a0ba712e72cc97311c5b1c098d5b72"]

[build]
type = "cargo"
script = """
cd "${srcdir}/bottom-${pkgver}"
cargo build --release --locked
install -Dm755 "target/release/bottom" "${DESTDIR}/usr/bin/bottom"
"""
