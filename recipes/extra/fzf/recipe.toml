[package]
name = "fzf"
version = "0.74.5"
release = 1
slot = "0"
description = "Command-line fuzzy finder"
license = "GPL-2.0-or-later"
upstream = "https://github.com/junegunn/fzf"

[dependencies]
runtime = ["glibc"]
build = ["gcc", "git", "go"]

[sources]
urls = [
    "https://github.com/junegunn/fzf/archive/refs/tags/v0.74.4.tar.gz"
]
sha256 = [
    "5529d08897b85ae773695787c811ff9c9eeee32419c8a297fa1dbe586ed0a27e"
]

[build]
type = "custom"
script = """
cd "${srcdir}/fzf-${pkgver}"
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
