[package]
name = "jq"
version = "1.8.2"
release = 1
slot = "0"
description = "Command-line JSON processor"
license = "MIT"
upstream = "https://jqlang.github.io/jq/"

[dependencies]
runtime = [
    "glibc",
]
build = [
    "make",
    "gcc",
    "bison",
    "pkgconf",
]

[sources]
urls = [
    "https://github.com/jqlang/jq/releases/download/jq-1.8.2/jq-1.8.2.tar.gz",
]
sha256 = ["71b8d6e8f5fe81f6c6d0d110e3892251f6ce76ed095abd315e26e6e1193af3af"]

[build]
type = "autotools"
script = """
cd "${srcdir}/jq-${pkgver}"
./configure --prefix=/usr --disable-maintainer-mode
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
