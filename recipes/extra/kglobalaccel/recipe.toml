[package]
name = "kglobalaccel"
version = "6.30.0"
release = 1
description = "Global desktop keyboard shortcuts management engine"
license = "LGPL-2.0-or-later"
upstream = "https://invent.kde.org/frameworks/kglobalaccel"
slot = "6"

[dependencies]
runtime = ["kconfig", "kcoreaddons", "kcrash", "kdbusaddons", "kwindowsystem"]
build = ["cmake", "ninja", "extra-cmake-modules", "pkgconf"]

[sources]
urls = ["https://download.kde.org/stable/frameworks/6.30/kglobalaccel-6.30.0.tar.xz"]
sha256 = ["e532ebd4cbfc8d6d79c6c38c556f1871315fedae8db2b69b574b9c496f171473"]

[build]
configure = """
cmake -B build -G Ninja \
    -DCMAKE_BUILD_TYPE=Release \
    -DCMAKE_INSTALL_PREFIX=/usr \
    -DBUILD_TESTING=OFF
"""
compile = """
cmake --build build -j$(nproc)
"""
install = """
DESTDIR="${DESTDIR}" cmake --install build
"""
