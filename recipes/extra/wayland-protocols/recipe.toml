[package]
name = "wayland-protocols"
version = "1.50"
release = 1
slot = "0"
description = "Specifications of extended Wayland protocols"
license = "GPL-2.0-or-later"
upstream = "https://wayland.freedesktop.org/"

[dependencies]
runtime = ["glibc"]
build = ["gcc", "wayland", "meson", "ninja"]

[sources]
urls = [
    "https://gitlab.freedesktop.org/wayland/wayland-protocols/-/releases/1.49/downloads/wayland-protocols-1.49.tar.xz"
]
sha256 = [
    "4460c20cfcf68b994a5ee206ed15fc19ad312f16c96075186e83b0e3f4aa48a5"
]

[build]
type = "meson"
script = """
cd "${srcdir}/wayland-protocols-${pkgver}"
meson setup build --prefix=/usr --buildtype=release
ninja -C build ${MAKEFLAGS}
DESTDIR="${DESTDIR}" ninja -C build install
"""
