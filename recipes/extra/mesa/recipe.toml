[package]
name = "mesa"
version = "26.2.3"
release = 1
slot = "0"
description = "Open-source OpenGL and Vulkan 3D graphics drivers"
license = "MIT"
upstream = "https://mesa.freedesktop.org/"

[dependencies]
runtime = ["glibc", "libdrm", "expat", "zstd", "zlib", "libxkbcommon", "wayland"]
build = ["meson", "ninja", "pkgconf", "python", "bison", "flex", "llvm", "clang", "wayland-protocols", "vulkan-headers"]

[sources]
urls = [
  "https://archive.mesa3d.org/mesa-26.2.3.tar.xz"
]
sha256 = [
  "1628058a8d2c0615975de5a15ab7bbb9638c50000b5bed9456ff423ea034a81f"
]

[build]
type = "meson"
script = """
meson setup build \
  --prefix=/usr \
  --sysconfdir=/etc \
  --buildtype=release \
  -Dplatforms=wayland \
  -Dgallium-drivers=radeonsi,r300,r600,nouveau,virgl,svga,swrast,iris,crocus,zink \
  -Dvulkan-drivers=amd,intel,intel_hasvk,swrast,nouveau \
  -Dgbm=enabled \
  -Degl=enabled \
  -Dgles1=disabled \
  -Dgles2=enabled \
  -Dglx=disabled \
  -Dllvm=enabled \
  -Dshared-glapi=enabled

ninja -C build
DESTDIR="${DESTDIR}" ninja -C build install
"""
