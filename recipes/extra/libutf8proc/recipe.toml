[package]
name = "libutf8proc"
version = "2.11.3"
release = 1
slot = "0"
description = "Clean C library for processing UTF-8 Unicode data"
license = "MIT"
upstream = "https://github.com/JuliaStrings/utf8proc"

[dependencies]
runtime = ["glibc"]
build = ["make", "gcc"]

[sources]
urls = [
    "https://github.com/JuliaStrings/utf8proc/archive/refs/tags/v2.11.3.tar.gz"
]
sha256 = [
    "abfed50b6d4da51345713661370290f4f4747263ee73dc90356299dfc7990c78"
]

[build]
type = "custom"
script = """
cd "${srcdir}/utf8proc-${pkgver}"
make ${MAKEFLAGS} prefix=/usr
make DESTDIR="${DESTDIR}" prefix=/usr install
"""
