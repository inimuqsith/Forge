[package]
name = "libutf8proc"
version = "2.10.0"
release = 1
slot = "0"
description = "Clean C library for processing UTF-8 Unicode data"
license = "MIT"
upstream = "https://github.com/JuliaStrings/utf8proc"

[dependencies]
runtime = ["glibc"]
build = ["make", "gcc"]

[sources]
urls = [
    "https://github.com/JuliaStrings/utf8proc/archive/refs/tags/v2.10.0.tar.gz"
]
sha256 = [
    "6f4f1b639daa6dca9f80bc5db1233e9cbaa31a67790887106160b33ef743f136"
]

[build]
type = "custom"
script = """
cd "${srcdir}/utf8proc-${pkgver}"
make ${MAKEFLAGS} prefix=/usr
make DESTDIR="${DESTDIR}" prefix=/usr install
"""
