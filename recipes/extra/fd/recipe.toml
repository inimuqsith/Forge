[package]
name = "fd"
version = "10.5.1"
release = 1
slot = "0"
description = "Simple, fast and user-friendly alternative to find"
license = "Apache-2.0 OR MIT"
upstream = "https://github.com/sharkdp/fd"

[dependencies]
runtime = ["glibc"]
build = ["cargo", "rust"]

[sources]
urls = [
    "https://github.com/sharkdp/fd/archive/refs/tags/v10.5.0.tar.gz"
]
sha256 = [
    "3ea70c258d3390a601b436b6f4c545e3a944ff3de44c8ee5542c05588e337032"
]

[build]
type = "cargo"
script = """
cd "${srcdir}/fd-${pkgver}"
cargo build --release
install -Dm755 target/release/fd "${DESTDIR}/usr/bin/fd"
"""
