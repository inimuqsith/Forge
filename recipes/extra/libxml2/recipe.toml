[package]
name = "libxml2"
version = "2.15.4"
release = 1
slot = "0"
description = "XML parsing library and utility toolkit"
license = "MIT"
upstream = "https://github.com/GNOME/libxml2"

[dependencies]
runtime = ["glibc", "zlib", "xz", "icu"]
build = ["make", "gcc", "pkgconf"]

[sources]
urls = [
    "https://github.com/GNOME/libxml2/archive/refs/tags/v2.15.4.tar.gz"
]
sha256 = [
    "bb01bd9ac9a7403f9706816fd6d3e7888041d32b0211075feb20e755d2a9f29d"
]

[build]
type = "autotools"
script = """
cd "${srcdir}/libxml2-${pkgver}"
./configure --prefix=/usr --sysconfdir=/etc --with-threads --with-history --with-icu
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
