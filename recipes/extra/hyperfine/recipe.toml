[package]
name = "hyperfine"
version = "1.21.0"
release = 1
slot = "0"
description = "A command-line benchmarking tool"
license = "GPL-2.0-or-later"
upstream = "https://github.com/sharkdp/hyperfine"

[dependencies]
runtime = ["glibc", "gcc"]
build = ["gcc", "cargo"]

[sources]
urls = [
    "https://github.com/sharkdp/hyperfine/archive/refs/tags/v1.20.0.tar.gz"
]
sha256 = [
    "aee01125074fd5a6a556818db7bba0577edae94cbe85165daae0e778aa28348d"
]

[build]
type = "cargo"
script = """
cd "${srcdir}/hyperfine-${pkgver}"
cargo build --release --locked
install -Dm755 "target/release/hyperfine" "${DESTDIR}/usr/bin/hyperfine"
"""
