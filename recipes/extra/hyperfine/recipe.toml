[package]
name = "hyperfine"
version = "1.20.0"
release = 1
slot = "0"
description = "A command-line benchmarking tool"
license = "GPL-2.0-or-later"
upstream = "https://github.com/sharkdp/hyperfine"

[dependencies]
runtime = ["glibc", "gcc"]
build = ["gcc", "cargo"]

[sources]
urls = [
    "https://github.com/sharkdp/hyperfine/archive/refs/tags/v1.20.0.tar.gz"
]
sha256 = ["f90c3b096af568438be7da52336784635a962c9822f10f98e5ad11ae8c7f5c64"]

[build]
type = "cargo"
script = """
cd "${srcdir}/hyperfine-${pkgver}"
cargo build --release --locked
install -Dm755 "target/release/hyperfine" "${DESTDIR}/usr/bin/hyperfine"
"""
