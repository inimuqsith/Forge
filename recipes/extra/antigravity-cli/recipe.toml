[package]
name = "antigravity-cli"
version = "1.2.7"
release = 1
slot = "0"
description = "Official Google DeepMind Antigravity CLI (agy) for agentic AI pair programming"
license = "Proprietary"
upstream = "https://antigravity.google"

[dependencies]
runtime = ["glibc", "ca-certificates"]
build = ["tar", "gzip"]

[sources]
urls = [
  "https://storage.googleapis.com/antigravity-public/antigravity-cli/1.2.7-6731160148115456/linux-x64/cli_linux_x64.tar.gz"
]
sha256 = [
  "e410dd56d8c213ef12643d3ff5eaaab57a17e05bbf72e9415322f23879fc4a18"
]

[build]
type = "binary"
script = """
mkdir -p "${DESTDIR}/usr/bin"

# Locate and install standalone agy executable
if [ -f "agy" ]; then
  install -Dm755 agy "${DESTDIR}/usr/bin/agy"
elif [ -f "antigravity" ]; then
  install -Dm755 antigravity "${DESTDIR}/usr/bin/agy"
fi

# Symlink antigravity-cli -> agy
ln -sf agy "${DESTDIR}/usr/bin/antigravity-cli"
"""
