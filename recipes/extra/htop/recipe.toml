[package]
name = "htop"
version = "3.5.3"
release = 1
slot = "0"
description = "Interactive process viewer for Unix systems"
license = "GPL-2.0-or-later"
upstream = "https://htop.dev/"

[dependencies]
runtime = [
    "glibc",
    "ncurses",
]
build = [
    "make",
    "gcc",
    "pkgconf",
]

[sources]
urls = [
    "https://github.com/htop-dev/htop/releases/download/3.5.3/htop-3.5.3.tar.xz",
]
sha256 = ["a8b164386494cb85bb255a415a3f5f80afe7a0c4491da5d113b3a0f951087e65"]

[build]
type = "autotools"
script = """
cd "${srcdir}/htop-${pkgver}"
./configure --prefix=/usr --sysconfdir=/etc --enable-unicode
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
