[package]
name = "ki18n"
version = "6.30.0"
release = 1
description = "Advanced internationalization framework for KDE applications"
license = "LGPL-2.0-or-later"
homepage = "https://invent.kde.org/frameworks/ki18n"
slot = "6"

[dependencies]
depends = ["qt6-base", "qt6-declarative"]
makedepends = ["cmake", "ninja", "extra-cmake-modules", "pkgconf", "python"]

[sources]
urls = ["https://download.kde.org/stable/frameworks/6.30/ki18n-6.30.0.tar.xz"]
sha256 = ["dfbfc8af89b3bc68810b094bf87746db87c3eeb35b75caeb1882681ebed563bd"]

[build]
configure = """
cmake -B build -G Ninja \
    -DCMAKE_BUILD_TYPE=Release \
    -DCMAKE_INSTALL_PREFIX=/usr \
    -DBUILD_TESTING=OFF
"""
compile = """
cmake --build build -j$(nproc)
"""
install = """
DESTDIR="${DESTDIR}" cmake --install build
"""
