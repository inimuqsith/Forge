[package]
name = "glib2"
version = "2.90.1"
release = 1
slot = "0"
description = "Core low-level data structure and utility library from GNOME"
license = "LGPL-2.1-or-later"
upstream = "https://github.com/GNOME/glib"

[dependencies]
runtime = ["glibc", "libffi", "pcre2", "zlib"]
build = ["meson", "ninja", "pkgconf", "gcc"]

[sources]
urls = [
    "https://github.com/GNOME/glib/archive/refs/tags/2.90.0.tar.gz"
]
sha256 = [
    "0888967a045e7ac95b940fffbb9d196b2e41ddc628fb1964bf438e35655b28f9"
]

[build]
type = "meson"
script = """
cd "${srcdir}/glib-${pkgver}"
meson setup build --prefix=/usr -Dlibmount=disabled -Dman=false
ninja -C build ${MAKEFLAGS}
DESTDIR="${DESTDIR}" ninja -C build install
"""
