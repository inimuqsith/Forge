[package]
name = "seatd"
version = "0.9.3"
release = 1
slot = "0"
description = "A minimal seat management daemon, and a universal seat management library"
license = "GPL-2.0-or-later"
upstream = "https://sr.ht/~kennylevinsen/seatd/"

[dependencies]
runtime = ["glibc", "eudev"]
build = ["gcc", "meson", "ninja", "scdoc"]

[sources]
urls = [
    "https://git.sr.ht/~kennylevinsen/seatd/archive/0.9.3.tar.gz"
]
sha256 = ["302564d54d8e28191fadfd734f2675ecb0c9e0615a58011b89ef15dfa4dbaa96", "e833292adf5da25b5258a5209c258f0e4c12e1d6fe81cf228fd0cfb575080d78"]

[build]
type = "meson"
script = """
cd "${srcdir}/seatd-${pkgver}"
meson setup build --prefix=/usr --buildtype=release
ninja -C build ${MAKEFLAGS}
DESTDIR="${DESTDIR}" ninja -C build install
"""
