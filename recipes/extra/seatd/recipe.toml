[package]
name = "seatd"
version = "0.9.3"
release = 1
description = "A minimal seat management daemon, and a universal seat management library"
license = "MIT"
homepage = "https://sr.ht/~kennylevinsen/seatd/"
slot = "0"

[dependencies]
depends = ["glibc", "eudev"]
makedepends = ["meson", "ninja", "pkgconf"]

[sources]
urls = ["https://git.sr.ht/~kennylevinsen/seatd/archive/0.9.3.tar.gz"]
sha256 = ["302564d54d8e28191fadfd734f2675ecb0c9e0615a58011b89ef15dfa4dbaa96"]

[build]
configure = """
meson setup build \
    --prefix=/usr \
    --buildtype=release \
    -Dman-pages=disabled
"""
compile = """
ninja -C build -j$(nproc)
"""
install = """
DESTDIR="${DESTDIR}" ninja -C build install
"""
