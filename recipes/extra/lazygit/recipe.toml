[package]
name = "lazygit"
version = "0.65.1"
release = 1
slot = "0"
description = "Simple terminal UI for git commands"
license = "GPL-2.0-or-later"
upstream = "https://github.com/jesseduffield/lazygit"

[dependencies]
runtime = ["glibc", "git"]
build = ["gcc", "go"]

[sources]
urls = [
    "https://github.com/jesseduffield/lazygit/archive/refs/tags/v0.65.1.tar.gz"
]
sha256 = ["df30ec1a5032b3c5672a30090fe787fb32d4122fd996d6d85e1d10135acfbc89"]

[build]
type = "custom"
script = """
cd "${srcdir}/lazygit-${pkgver}"
go build -o "lazygit" .
install -Dm755 "lazygit" "${DESTDIR}/usr/bin/lazygit"
"""
