[package]
name = "zellij"
version = "0.46.0"
release = 1
slot = "0"
description = "A terminal multiplexer"
license = "GPL-2.0-or-later"
upstream = "https://zellij.dev"

[dependencies]
runtime = ["glibc", "curl", "gcc", "zlib"]
build = ["rust", "mold", "llvm", "pkgconf"]

[sources]
urls = [
    "https://github.com/zellij-org/zellij/archive/refs/tags/v0.45.1.tar.gz"
]
sha256 = [
    "2dfa237fea447f3cc98954e81b0097b9d25841010036720e11f67880fe7861f0"
]

[build]
type = "cargo"
script = """
cd "${srcdir}/zellij-${pkgver}"
cargo build --release --locked
install -Dm755 "target/release/zellij" "${DESTDIR}/usr/bin/zellij"
"""
