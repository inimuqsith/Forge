[package]
name = "tmux"
version = "3.5a"
release = 1
slot = "0"
description = "Terminal multiplexer workspace utility"
license = "ISC"
upstream = "https://tmux.github.io/"

[dependencies]
runtime = [
    "glibc",
    "ncurses",
]
build = [
    "make",
    "gcc",
    "pkgconf",
]

[sources]
urls = [
    "https://github.com/tmux/tmux/releases/download/3.5a/tmux-3.5a.tar.gz",
]
sha256 = []

[build]
type = "autotools"
script = """
cd "${srcdir}/tmux-${pkgver}"
./configure --prefix=/usr --sysconfdir=/etc
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
