[package]
name = "mpc"
version = "1.4.1"
release = 1
slot = "0"
description = "Library for the arithmetic of complex numbers with arbitrarily high precision"
license = "LGPL-3.0-or-later"
upstream = "https://www.multiprecision.org/mpc/"

[dependencies]
runtime = ["glibc", "gmp", "mpfr"]
build = []

[sources]
urls = [
    "https://ftp.gnu.org/gnu/mpc/mpc-1.4.1.tar.xz"
]
sha256 = [
    "91204cd32f164bd3b7c992d4a6a8ce6519511aadab30f78b6982d0bf8d73e931"
]

[build]
type = "autotools"
script = """
cd "${srcdir}/mpc-${pkgver}"
./configure --prefix=/usr
make ${MAKEFLAGS}
make DESTDIR="${DESTDIR}" install
"""
