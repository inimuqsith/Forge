name: Automated Upstream Recipe Updater

on:
  schedule:
    # Berjalan otomatis setiap 6 jam
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-recipes:
    name: Probe Upstream & Auto-Bump Recipes
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit Upstream Recipes Status
        run: python3 scripts/maintainer.py --audit

      - name: Auto-Bump Outdated Recipes
        run: python3 scripts/maintainer.py --bump all --no-push

      - name: Regenerate Documentation SSOT Matrix
        run: python3 scripts/maintainer.py --matrix

      - name: Commit and Push Updated Recipes
        run: |
          if [[ -n $(git status --porcelain recipes/) ]]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add recipes/
            git commit -m "chore(recipes): automated upstream recipe version bump [skip ci]"
            git push origin main
            echo "✓ Resep berhasil diperbarui dan di-push ke GitHub!"
          else
            echo "✓ Seluruh resep sudah up-to-date. Tidak ada perubahan."
          fi
